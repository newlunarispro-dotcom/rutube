<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Комета — Мессенджер</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  :root {
    --orange: #f59e0b; --red: #ef4444; --bg: #050814;
    --panel: rgba(15, 23, 42, 0.95); --panel-light: rgba(30, 41, 59, 0.9);
    --border: rgba(255,255,255,0.08); --text: #ffffff; --text-muted: #94a3b8;
    --msg-in: rgba(30, 41, 59, 0.95); --focus: #f59e0b;
  }
  body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; position: relative; }
  
  /* Для Smart TV - жирная обводка при навигации пультом */
  *:focus { outline: 3px solid var(--orange); outline-offset: 4px; }

  .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px), radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px); background-size: 550px 550px, 350px 350px; background-position: 0 0, 40px 60px; opacity: 0.15; z-index: 0; pointer-events: none; animation: starsAnim 100s linear infinite; }
  @keyframes starsAnim { 100% { background-position: 550px 550px, 390px 410px; } }
  #wave-canvas { position: fixed; bottom: 0; left: 0; width: 100%; height: 100vh; z-index: 1; pointer-events: none; }

  /* --- ЭКРАН ВХОДА --- */
  .auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 50; background: rgba(5, 8, 20, 0.9); backdrop-filter: blur(10px); transition: opacity 0.3s; }
  .auth-box { background: var(--panel); border: 1px solid var(--border); border-radius: 24px; padding: 40px; width: 420px; max-width: 95%; }
  .auth-tabs { display: flex; margin-bottom: 25px; border-bottom: 1px solid var(--border); }
  .auth-tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; color: var(--text-muted); font-weight: 600; transition: 0.2s; border-bottom: 2px solid transparent; }
  .auth-tab.active { color: var(--orange); border-bottom-color: var(--orange); }
  .auth-input { width: 100%; padding: 14px; background: var(--panel-light); border: 1px solid var(--border); border-radius: 12px; color: #fff; outline: none; margin-bottom: 15px; font-size: 15px; }
  .auth-input:focus { border-color: var(--orange); }
  .auth-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, var(--orange), var(--red)); border: none; border-radius: 12px; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; margin-bottom: 15px; }
  .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(245, 158, 11, 0.3); }
  .google-btn { width: 100%; padding: 15px; background: #fff; color: #333; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .google-btn img { width: 20px; }

  /* --- МЕССЕНДЖЕР --- */
  .app-container { display: none; width: 100%; height: 100%; z-index: 10; }
  .app-container.active { display: flex; }
  .panel { background: var(--panel); display: flex; flex-direction: column; height: 100%; backdrop-filter: blur(20px); }
  
  /* Левая панель */
  .sidebar { width: 340px; min-width: 340px; border-right: 1px solid var(--border); transition: 0.3s; display: flex; flex-direction: column; }
  .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .logo-mark { width: 32px; height: 32px; background: linear-gradient(135deg, var(--orange), var(--red)); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .user-avatar-sm { width: 40px; height: 40px; border-radius: 50%; background: #3b82f6; display: flex; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; overflow: hidden; flex-shrink: 0; }
  .user-avatar-sm img { width: 100%; height: 100%; object-fit: cover; }
  
  .search-box { padding: 12px 20px; }
  .search-input { width: 100%; background: var(--panel-light); border: 1px solid var(--border); padding: 12px 16px; border-radius: 12px; color: #fff; outline: none; }
  .search-input:focus { border-color: var(--orange); }
  
  .chat-list { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
  .chat-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 14px; cursor: pointer; margin-bottom: 4px; transition: 0.2s; }
  .chat-item:hover { background: rgba(255,255,255,0.05); }
  .chat-item.active { background: rgba(245, 158, 11, 0.15); }
  .avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; color: #fff; flex-shrink: 0; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .chat-info { flex: 1; min-width: 0; }
  .chat-name { font-weight: 600; font-size: 15px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  
  /* Центральная панель */
  .chat-area { flex: 1; display: flex; flex-direction: column; position: relative; }
  .chat-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--panel); z-index: 2; }
  .chat-header-info { display: flex; align-items: center; gap: 14px; }
  .chat-header-name { font-weight: 700; font-size: 17px; }
  .header-actions { display: flex; gap: 8px; }
  .action-btn { padding: 10px 16px; border-radius: 10px; border: none; background: var(--panel-light); color: var(--text-muted); cursor: pointer; font-size: 16px; font-weight: 600; transition: 0.2s; }
  .action-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
  
  .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; z-index: 1; }
  .message { display: flex; gap: 12px; max-width: 75%; animation: msgIn 0.3s ease; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .message.out { align-self: flex-end; flex-direction: row-reverse; }
  .msg-bubble { padding: 12px 18px; border-radius: 20px; font-size: 15px; line-height: 1.45; }
  .message.in .msg-bubble { background: var(--msg-in); border-bottom-left-radius: 4px; }
  .message.out .msg-bubble { background: linear-gradient(135deg, var(--orange), var(--red)); color: #fff; border-bottom-right-radius: 4px; }
  .msg-author { font-size: 12px; color: var(--orange); margin-bottom: 4px; font-weight: 600; }
  
  /* Кнопки бота */
  .bot-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .bot-btn { padding: 10px 15px; background: var(--panel-light); border: 1px solid var(--orange); color: var(--orange); border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; }
  .bot-btn:hover { background: var(--orange); color: #fff; }

  /* Поле ввода */
  .chat-input-area { padding: 16px 24px 24px; background: var(--panel); z-index: 2; }
  .input-wrapper { display: flex; align-items: flex-end; gap: 8px; background: var(--panel-light); border: 1px solid var(--border); border-radius: 18px; padding: 8px; }
  .input-field { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; resize: none; outline: none; max-height: 120px; padding: 10px; }
  .icon-btn { width: 44px; height: 44px; border-radius: 14px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text-muted); background: transparent; transition: 0.2s; }
  .icon-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
  .send-btn { width: 44px; height: 44px; border-radius: 14px; background: linear-gradient(135deg, var(--orange), var(--red)); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; flex-shrink: 0; }
  .recording { color: var(--red); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(1.1); } }

  /* --- МОДАЛКИ --- */
  .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; display: none; align-items: center; justify-content: center; }
  .modal.active { display: flex; }
  .modal-content { background: var(--panel); border: 1px solid var(--border); border-radius: 24px; padding: 30px; width: 400px; max-width: 90%; text-align: center; }
  .avatar-preview { width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 20px; background: #3b82f6; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; font-size: 40px; overflow: hidden; cursor: pointer; position: relative; }
  .avatar-preview:hover::after { content: '📷'; position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .input-group { margin-bottom: 15px; text-align: left; }
  .input-group label { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; display: block; }
  .input-group input { width: 100%; padding: 12px; background: var(--panel-light); border: 1px solid var(--border); border-radius: 12px; color: #fff; outline: none; }
  .input-group input:focus { border-color: var(--orange); }

  /* --- ЗВОНОК --- */
  .call-overlay { position: fixed; inset: 0; background: rgba(5, 8, 20, 0.95); z-index: 200; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(20px); }
  .call-overlay.active { display: flex; }
  .call-avatar { width: 150px; height: 150px; border-radius: 50%; background: var(--orange); display: flex; align-items: center; justify-content: center; font-size: 60px; font-weight: bold; margin-bottom: 20px; animation: pulse 2s infinite; }
  .call-name { font-size: 28px; font-weight: bold; margin-bottom: 10px; }
  .call-timer { font-size: 18px; color: var(--orange); margin-bottom: 40px; }
  .end-call-btn { padding: 20px 40px; background: var(--red); border: none; border-radius: 20px; color: #fff; font-size: 20px; font-weight: bold; cursor: pointer; }

  /* --- АДАПТАЦИЯ ПОД ТЕЛЕФОНЫ --- */
  @media (max-width: 768px) {
    .sidebar { position: absolute; left: -100%; z-index: 20; width: 100%; background: var(--bg); }
    .sidebar.active { left: 0; }
    .menu-btn { display: block !important; }
    .messages { padding: 15px; }
  }
  .menu-btn { display: none; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; margin-right: 15px; }
</style>
</head>
<body>

<div class="stars"></div>
<canvas id="wave-canvas"></canvas>

<!-- ЭКРАН ВХОДА -->
<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <div style="text-align: center; margin-bottom: 20px;">
      <div class="logo-mark" style="width: 60px; height: 60px; font-size: 30px; margin: 0 auto 10px;">☄️</div>
      <h2>Комета</h2>
    </div>
    
    <div class="auth-tabs">
      <div class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">Вход</div>
      <div class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">Создать аккаунт</div>
    </div>

    <div id="authFormLogin">
      <input type="email" class="auth-input" id="loginEmail" placeholder="Email">
      <input type="password" class="auth-input" id="loginPass" placeholder="Пароль">
      <button class="auth-btn" onclick="loginWithEmail()">Войти</button>
    </div>

    <div id="authFormRegister" style="display: none;">
      <input type="text" class="auth-input" id="regName" placeholder="Никнейм">
      <input type="tel" class="auth-input" id="regPhone" placeholder="Номер телефона (обязательно)">
      <input type="email" class="auth-input" id="regEmail" placeholder="Email">
      <input type="password" class="auth-input" id="regPass" placeholder="Пароль">
      <button class="auth-btn" onclick="registerWithEmail()">Зарегистрироваться</button>
    </div>

    <div style="text-align: center; color: var(--text-muted); margin: 15px 0;">или</div>
    <button class="google-btn" onclick="loginWithGoogle()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"> Войти через Google
    </button>
  </div>
</div>

<!-- МЕССЕНДЖЕР -->
<div class="app-container" id="appContainer">
  <aside class="panel sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo"><div class="logo-mark">☄️</div>Комета</div>
      <div class="user-avatar-sm" id="myAvatarBtn" onclick="openProfile()">Я</div>
    </div>
    
    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" placeholder="Поиск по нику или телефону...">
    </div>
    
    <div class="chat-list" id="chatList">
      <!-- Список чатов рендерится JS -->
    </div>
  </aside>

  <main class="chat-area">
    <header class="chat-header">
      <div class="chat-header-info">
        <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('active')">☰</button>
        <div class="avatar" id="chatHeaderAvatar" style="background: #8b5cf6; width: 40px; height: 40px; font-size: 16px;">О</div>
        <div>
          <div class="chat-header-name" id="chatHeaderName">Общий чат</div>
        </div>
      </div>
      <div class="header-actions" id="callActions" style="display: none;">
        <button class="action-btn" onclick="startCall()">📞 Звонок</button>
      </div>
    </header>
    
    <div class="messages" id="messagesContainer"></div>
    
    <div class="chat-input-area">
      <div class="input-wrapper">
        <button class="icon-btn" id="micBtn" title="Голосовое">🎤</button>
        <textarea class="input-field" id="messageInput" placeholder="Написать сообщение..." rows="1"></textarea>
        <button class="send-btn" onclick="sendMsg()">➤</button>
      </div>
    </div>
  </main>
</div>

<!-- МОДАЛКА ПРОФИЛЯ -->
<div class="modal" id="profileModal">
  <div class="modal-content">
    <h2>Профиль</h2>
    <div class="avatar-preview" id="avatarPreview" onclick="document.getElementById('avatarFile').click()"></div>
    <input type="file" id="avatarFile" accept="image/*" style="display: none;">
    
    <div class="input-group">
      <label>Никнейм</label>
      <input type="text" id="nicknameInput" placeholder="Ваше имя">
    </div>
    <div class="input-group">
      <label>Номер телефона</label>
      <input type="tel" id="phoneInput" placeholder="+7...">
    </div>
    <button class="auth-btn" onclick="saveProfile()">Сохранить</button>
    <button class="auth-btn" style="background: transparent; color: var(--text-muted);" onclick="document.getElementById('profileModal').classList.remove('active')">Отмена</button>
  </div>
</div>

<!-- ЭКРАН ЗВОНКА -->
<div class="call-overlay" id="callOverlay">
  <div class="call-avatar" id="callAvatar">А</div>
  <div class="call-name" id="callName">Собеседник</div>
  <div class="call-timer" id="callTimer">Вызов...</div>
  <button class="end-call-btn" onclick="endCall()">Завершить</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getDatabase, ref, push, onChildAdded, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBHbm84N2Bjed93Xb2ccpWPsCTW138wf64",
    authDomain: "kometanm.firebaseapp.com",
    databaseURL: "https://kometanm-default-rtdb.firebaseio.com",
    projectId: "kometanm",
    storageBucket: "kometanm.firebasestorage.app",
    messagingSenderId: "389756589729",
    appId: "1:389756589729:web:bc82b216570226bbf142e0"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const provider = new GoogleAuthProvider();

  // DOM элементы
  const authScreen = document.getElementById('authScreen');
  const appContainer = document.getElementById('appContainer');
  const myAvatarBtn = document.getElementById('myAvatarBtn');
  const messagesContainer = document.getElementById('messagesContainer');
  const messageInput = document.getElementById('messageInput');
  const searchInput = document.getElementById('searchInput');
  const chatList = document.getElementById('chatList');
  const callActions = document.getElementById('callActions');

  let currentUser = null;
  let userProfile = { nickname: 'Пользователь', phone: '', avatar: '' };
  let currentChatId = 'general';
  let currentChatName = 'Общий чат';
  let currentChatAvatar = 'О';
  
  let mediaRecorder;
  let audioChunks = [];
  let callInterval;

  // ================= АВТОРИЗАЦИЯ =================
  window.switchAuthTab = (tab) => {
    document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
    document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
    document.getElementById('authFormLogin').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('authFormRegister').style.display = tab === 'register' ? 'block' : 'none';
  };

  window.loginWithEmail = () => {
    const email = document.getElementById('loginEmail').value;
    const pass = document.getElementById('loginPass').value;
    signInWithEmailAndPassword(auth, email, pass).catch(e => alert("Ошибка: " + e.message));
  };

  window.registerWithEmail = () => {
    const name = document.getElementById('regName').value;
    const phone = document.getElementById('regPhone').value;
    const email = document.getElementById('regEmail').value;
    const pass = document.getElementById('regPass').value;

    if (!phone) return alert("Введите номер телефона!");
    if (!name) return alert("Введите никнейм!");

    createUserWithEmailAndPassword(auth, email, pass)
      .then(cred => {
        set(ref(db, 'users/' + cred.user.uid), { nickname: name, phone: phone, avatar: '' });
      })
      .catch(e => alert("Ошибка: " + e.message));
  };

  window.loginWithGoogle = () => {
    signInWithPopup(auth, provider).catch(e => alert(e.message));
  };

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      const snapshot = await get(ref(db, 'users/' + user.uid));
      
      if (snapshot.exists()) {
        userProfile = snapshot.val();
        if (!userProfile.phone) userProfile.phone = "";
      } else {
        userProfile = { nickname: user.displayName || 'Пользователь', phone: '', avatar: user.photoURL || '' };
        set(ref(db, 'users/' + user.uid), userProfile);
      }

      updateProfileUI();
      authScreen.style.display = 'none';
      appContainer.classList.add('active');
      loadChats();
      openChat('general', 'Общий чат', 'О', '#8b5cf6');
    } else {
      authScreen.style.display = 'flex';
      appContainer.classList.remove('active');
    }
  });

  // ================= ПРОФИЛЬ И АВАТАРКА =================
  function updateProfileUI() {
    if (userProfile.avatar) {
      myAvatarBtn.innerHTML = `<img src="${userProfile.avatar}">`;
      document.getElementById('avatarPreview').style.backgroundImage = `url(${userProfile.avatar})`;
      document.getElementById('avatarPreview').textContent = '';
    } else {
      myAvatarBtn.textContent = userProfile.nickname[0].toUpperCase();
      document.getElementById('avatarPreview').style.backgroundImage = 'none';
      document.getElementById('avatarPreview').textContent = userProfile.nickname[0].toUpperCase();
    }
    document.getElementById('nicknameInput').value = userProfile.nickname;
    document.getElementById('phoneInput').value = userProfile.phone;
  }

  window.openProfile = () => document.getElementById('profileModal').classList.add('active');

  // Загрузка аватарки ФАЙЛОМ с исправленным багом
  document.getElementById('avatarFile').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(event) {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 120; canvas.height = 120;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, 120, 120);
        userProfile.avatar = canvas.toDataURL('image/jpeg', 0.8); // Сжатие
        updateProfileUI();
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  window.saveProfile = () => {
    userProfile.nickname = document.getElementById('nicknameInput').value.trim() || 'Пользователь';
    userProfile.phone = document.getElementById('phoneInput').value.trim();
    set(ref(db, 'users/' + currentUser.uid), userProfile);
    updateProfileUI();
    document.getElementById('profileModal').classList.remove('active');
  };

  // ================= СПИСОК ЧАТОВ И ПОИСК =================
  function loadChats() {
    chatList.innerHTML = `
      <div class="chat-item active" onclick="openChat('general', 'Общий чат', 'О', '#8b5cf6')">
        <div class="avatar" style="background: #8b5cf6;">О</div>
        <div class="chat-info"><div class="chat-name">Общий чат</div></div>
      </div>
      <div class="chat-item" onclick="openChat('bot', 'BotKometa', '🤖', '#ef4444')">
        <div class="avatar" style="background: #ef4444;">🤖</div>
        <div class="chat-info"><div class="chat-name">BotKometa</div></div>
      </div>
    `;
  }

  // Поиск юзеров по нику или телефону
  searchInput.addEventListener('input', async (e) => {
    const query = e.target.value.toLowerCase().trim();
    
    if (query === '') {
      loadChats();
      return;
    }

    chatList.innerHTML = '<div style="padding:15px; color:var(--text-muted);">Поиск...</div>';
    
    try {
      const usersRef = ref(db, 'users');
      const snapshot = await get(usersRef);
      
      if (snapshot.exists()) {
        chatList.innerHTML = ''; // Очищаем
        const users = snapshot.val();
        let found = 0;

        for (const uid in users) {
          if (uid === currentUser.uid) continue; // Себя не ищем
          
          const u = users[uid];
          const matchNick = u.nickname && u.nickname.toLowerCase().includes(query);
          const matchPhone = u.phone && u.phone.includes(query);

          if (matchNick || matchPhone) {
            found++;
            const chatId = 'chat_' + [currentUser.uid, uid].sort().join('_'); // Уникальный ID для личного чата
            
            const div = document.createElement('div');
            div.className = 'chat-item';
            div.onclick = () => openChat(chatId, u.nickname, u.nickname[0], '#3b82f6', u.avatar);
            
            div.innerHTML = `
              <div class="avatar" style="background: #3b82f6;">
                ${u.avatar ? `<img src="${u.avatar}">` : u.nickname[0]}
              </div>
              <div class="chat-info">
                <div class="chat-name">${u.nickname}</div>
                <div style="font-size:12px; color:var(--text-muted);">${u.phone || 'Без номера'}</div>
              </div>
            `;
            chatList.appendChild(div);
          }
        }

        if (found === 0) {
          chatList.innerHTML = '<div style="padding:15px; color:var(--text-muted);">Никого не найдено</div>';
        }
      }
    } catch (err) {
      console.error(err);
    }
  });

  // ================= ОТКРЫТИЕ ЧАТА =================
  window.openChat = (id, name, initial, color, avatarUrl = null) => {
    currentChatId = id;
    currentChatName = name;
    
    // Обновляем шапку
    document.getElementById('chatHeaderName').textContent = name;
    const headerAvatar = document.getElementById('chatHeaderAvatar');
    if (avatarUrl) {
      headerAvatar.innerHTML = `<img src="${avatarUrl}">`;
      headerAvatar.style.background = '#3b82f6';
    } else {
      headerAvatar.innerHTML = initial;
      headerAvatar.style.background = color;
    }

    // Показываем кнопку звонка только в личных чатах
    callActions.style.display = (id.startsWith('chat_')) ? 'flex' : 'none';
    
    // Закрываем сайдбар на мобилке
    document.getElementById('sidebar').classList.remove('active');

    // Загружаем сообщения
    messagesContainer.innerHTML = '';
    const messagesRef = ref(db, 'chats/' + currentChatId + '/messages');
    onChildAdded(messagesRef, (snapshot) => {
      const msg = snapshot.val();
      renderMessage(msg);
    });
  };

  // ================= ОТПРАВКА И РЕНДЕР =================
  function renderMessage(msg) {
    const isMine = msg.uid === currentUser.uid;
    const msgEl = document.createElement('div');
    msgEl.className = `message ${isMine ? 'out' : 'in'}`;
    
    let authorHtml = !isMine ? `<div class="msg-author">${msg.nickname}</div>` : '';
    let contentHtml = '';

    if (msg.type === 'voice') {
      contentHtml = `<div class="msg-bubble"><audio controls src="${msg.audio}" style="max-width:200px;"></audio></div>`;
    } else if (msg.type === 'bot_buttons') {
      contentHtml = `
        <div class="msg-bubble">
          ${msg.text}
          <div class="bot-buttons">
            <button class="bot-btn" onclick="botAction('api')">🔑 Получить API</button>
            <button class="bot-btn" onclick="botAction('weather')">🌤 Погода</button>
          </div>
        </div>
      `;
    } else {
      contentHtml = `<div class="msg-bubble">${msg.text}</div>`;
    }
    
    msgEl.innerHTML = `
      <div>
        ${authorHtml}
        ${contentHtml}
      </div>
    `;
    messagesContainer.appendChild(msgEl);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  window.sendMsg = () => {
    const text = messageInput.value.trim();
    if (!text || !currentUser) return;
    const now = new Date();
    const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

    const msgData = { uid: currentUser.uid, nickname: userProfile.nickname, time: timeStr, type: 'text', text: text };
    push(ref(db, 'chats/' + currentChatId + '/messages'), msgData);
    
    messageInput.value = '';
    messageInput.style.height = 'auto';

    // Логика Бота
    if (currentChatId === 'bot') {
      setTimeout(() => {
        push(ref(db, 'chats/bot/messages'), {
          uid: 'bot', nickname: 'BotKometa', type: 'bot_buttons', text: `Привет, ${userProfile.nickname}! Я бот Кометы. Что хочешь сделать?`
        });
      }, 1000);
    }
  };

  messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  });

  // Действия бота
  window.botAction = (action) => {
    if (action === 'api') {
      const apiKey = 'KM-' + Math.random().toString(36).substring(2, 10).toUpperCase();
      const apiUrl = `http://kometa.c6t.ru/web?api=${apiKey}`;
      push(ref(db, 'chats/bot/messages'), {
        uid: 'bot', nickname: 'BotKometa', type: 'text', text: `Твой API ключ готов!\n\nСсылка для интеграций:\n${apiUrl}\n\nНикому не показывай.`
      });
    } else if (action === 'weather') {
      push(ref(db, 'chats/bot/messages'), {
        uid: 'bot', nickname: 'BotKometa', type: 'text', text: `Сейчас в твоем городе +22°C, ясно ☀️`
      });
    }
  };

  // ================= ГОЛОСОВЫЕ СООБЩЕНИЯ =================
  const micBtn = document.getElementById('micBtn');
  micBtn.onclick = async () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      micBtn.classList.remove('recording');
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.onload = (e) => {
          const now = new Date();
          const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
          push(ref(db, 'chats/' + currentChatId + '/messages'), {
            uid: currentUser.uid, nickname: userProfile.nickname, time: timeStr, type: 'voice', audio: e.target.result
          });
        };
        reader.readAsDataURL(audioBlob);
        stream.getTracks().forEach(track => track.stop());
      };

      mediaRecorder.start();
      micBtn.classList.add('recording');
    } catch (err) {
      // ПОНЯТНАЯ ОШИБКА ДЛЯ МИКРОФОНА
      alert("⚠️ Нет доступа к микрофону!\n\n1. Нажми на замочек 🔒 в адресной строке браузера.\n2. Разреши доступ к микрофону.\n3. Обнови страницу.");
    }
  };

  // ================= ЗВОНКИ (Имитация) =================
  window.startCall = () => {
    if (!currentChatId.startsWith('chat_')) return;
    const overlay = document.getElementById('callOverlay');
    document.getElementById('callName').textContent = currentChatName;
    document.getElementById('callAvatar').textContent = currentChatName[0];
    document.getElementById('callTimer').textContent = 'Соединение...';
    overlay.classList.add('active');

    let seconds = 0;
    setTimeout(() => {
      document.getElementById('callTimer').textContent = '00:00';
      clearInterval(callInterval);
      callInterval = setInterval(() => {
        seconds++;
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        document.getElementById('callTimer').textContent = `${m}:${s}`;
      }, 1000);
    }, 2000);
  };

  window.endCall = () => {
    document.getElementById('callOverlay').classList.remove('active');
    clearInterval(callInterval);
  };

  // ================= ФОН (Волны) =================
  const canvas = document.getElementById('wave-canvas');
  const ctx = canvas.getContext('2d');
  let width, height, time = 0;

  function resize() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
  window.addEventListener('resize', resize); resize();

  function drawWave() {
    ctx.clearRect(0, 0, width, height);
    const waves = [
      { amplitude: 40, frequency: 0.003, speed: 0.02, color: 'rgba(245, 158, 11, 0.15)' },
      { amplitude: 60, frequency: 0.002, speed: -0.015, color: 'rgba(239, 68, 68, 0.15)' }
    ];
    waves.forEach((wave) => {
      ctx.beginPath(); ctx.moveTo(0, height);
      for (let x = 0; x <= width; x += 5) {
        const y = Math.sin(x * wave.frequency + time * wave.speed) * wave.amplitude;
        ctx.lineTo(x, height * 0.8 + y); 
      }
      ctx.lineTo(width, height); ctx.lineTo(0, height);
      ctx.fillStyle = wave.color; ctx.fill();
    });
    time += 1; requestAnimationFrame(drawWave);
  }
  drawWave();
</script>
</body>
</html>
