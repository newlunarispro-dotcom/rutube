<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Комета — Мессенджер</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  :root {
    --orange: #f59e0b; --red: #ef4444; --bg: #050814;
    --panel: rgba(15, 23, 42, 0.85); --panel-light: rgba(30, 41, 59, 0.9);
    --border: rgba(255,255,255,0.08); --text: #ffffff; --text-muted: #94a3b8;
    --msg-in: rgba(30, 41, 59, 0.95); --glass: blur(16px);
  }
  body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; position: relative; }
  
  /* Космический фон и волны */
  .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px), radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px); background-size: 550px 550px, 350px 350px; background-position: 0 0, 40px 60px; opacity: 0.15; z-index: 0; pointer-events: none; animation: starsAnim 100s linear infinite; }
  @keyframes starsAnim { 100% { background-position: 550px 550px, 390px 410px; } }
  #wave-canvas { position: fixed; bottom: 0; left: 0; width: 100%; height: 100vh; z-index: 1; pointer-events: none; }

  /* Экран входа */
  .login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 50; background: rgba(5, 8, 20, 0.8); backdrop-filter: var(--glass); transition: opacity 0.5s; }
  .login-box { background: var(--panel); border: 1px solid var(--border); border-radius: 30px; padding: 50px 40px; text-align: center; width: 400px; max-width: 90%; box-shadow: 0 20px 60px rgba(255, 69, 0, 0.15); position: relative; overflow: hidden; }
  .login-logo { width: 80px; height: 80px; background: linear-gradient(135deg, var(--orange), var(--red)); border-radius: 24px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; box-shadow: 0 10px 30px rgba(245, 158, 11, 0.4); }
  .login-title { font-size: 32px; font-weight: 800; margin-bottom: 10px; }
  .google-btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 16px; background: #fff; color: #333; border: none; border-radius: 16px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
  .google-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255,255,255,0.2); }
  .google-btn img { width: 24px; height: 24px; }

  /* Мессенджер */
  .app-container { display: flex; width: 100%; height: 100%; z-index: 10; opacity: 0; pointer-events: none; transition: opacity 0.5s; }
  .app-container.active { opacity: 1; pointer-events: all; }
  .panel { background: var(--panel); display: flex; flex-direction: column; height: 100%; backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass); }
  
  /* Левая панель */
  .sidebar { width: 340px; min-width: 340px; border-right: 1px solid var(--border); }
  .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .logo-mark { width: 32px; height: 32px; background: linear-gradient(135deg, var(--orange), var(--red)); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .user-avatar-sm { width: 40px; height: 40px; border-radius: 50%; background: #3b82f6; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; cursor: pointer; overflow: hidden; border: 2px solid transparent; transition: 0.2s; }
  .user-avatar-sm:hover { border-color: var(--orange); }
  .user-avatar-sm img { width: 100%; height: 100%; object-fit: cover; }
  .search-box { padding: 12px 20px; }
  .search-input { width: 100%; background: var(--panel-light); border: 1px solid var(--border); padding: 12px 16px; border-radius: 12px; color: #fff; font-size: 14px; outline: none; transition: 0.2s; }
  .search-input:focus { border-color: var(--orange); }
  
  .chat-list { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
  .chat-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 14px; cursor: pointer; margin-bottom: 4px; transition: 0.2s; }
  .chat-item:hover { background: rgba(255,255,255,0.05); }
  .chat-item.active { background: rgba(245, 158, 11, 0.15); }
  .avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; color: #fff; flex-shrink: 0; }
  .chat-info { flex: 1; min-width: 0; }
  .chat-name { font-weight: 600; font-size: 15px; margin-bottom: 3px; display: flex; justify-content: space-between; }

  /* Центральная панель */
  .chat-area { flex: 1; display: flex; flex-direction: column; position: relative; }
  .chat-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--panel); z-index: 2; }
  .chat-header-info { display: flex; align-items: center; gap: 14px; }
  .chat-header-name { font-weight: 700; font-size: 17px; }
  .chat-header-sub { font-size: 12px; color: var(--text-muted); }
  
  .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; z-index: 1; }
  .message { display: flex; gap: 12px; max-width: 75%; animation: msgIn 0.3s ease; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .message.out { align-self: flex-end; flex-direction: row-reverse; }
  
  .msg-bubble { padding: 12px 18px; border-radius: 20px; font-size: 15px; line-height: 1.45; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
  .message.in .msg-bubble { background: var(--msg-in); border-bottom-left-radius: 4px; }
  .message.out .msg-bubble { background: linear-gradient(135deg, var(--orange), var(--red)); color: #fff; border-bottom-right-radius: 4px; }
  .msg-author { font-size: 12px; color: var(--orange); margin-bottom: 4px; font-weight: 600; display: flex; gap: 5px;}
  .msg-author span { color: var(--text-muted); font-weight: normal; }
  .msg-time { font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 4px; text-align: right; }
  
  /* Голосовые сообщения */
  .voice-msg { display: flex; align-items: center; gap: 10px; min-width: 200px; }
  .voice-msg audio { width: 100%; height: 36px; outline: none; }
  .voice-msg audio::-webkit-media-controls-panel { background-color: rgba(255,255,255,0.1); }

  /* Поле ввода */
  .chat-input-area { padding: 16px 24px 24px; background: var(--panel); z-index: 2; }
  .input-wrapper { display: flex; align-items: flex-end; gap: 8px; background: var(--panel-light); border: 1px solid var(--border); border-radius: 18px; padding: 8px; }
  .input-field { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; resize: none; outline: none; max-height: 120px; padding: 10px 0 10px 10px; }
  .icon-btn { width: 44px; height: 44px; border-radius: 14px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text-muted); background: transparent; transition: 0.2s; flex-shrink: 0; }
  .icon-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
  .icon-btn.recording { color: var(--red); animation: pulse 1s infinite; }
  .send-btn { width: 44px; height: 44px; border-radius: 14px; background: linear-gradient(135deg, var(--orange), var(--red)); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; flex-shrink: 0; }
  @keyframes pulse { 50% { transform: scale(1.1); } }

  /* Модалка профиля */
  .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
  .modal.active { display: flex; }
  .modal-content { background: var(--panel); border: 1px solid var(--border); border-radius: 24px; padding: 30px; width: 400px; text-align: center; }
  .modal-content h2 { margin-bottom: 20px; }
  .avatar-preview { width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 20px; background: #3b82f6; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; font-size: 40px; overflow: hidden; position: relative; cursor: pointer; border: 2px solid var(--border); }
  .avatar-preview:hover::after { content: '📷'; position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .input-group { margin-bottom: 15px; text-align: left; }
  .input-group label { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; display: block; }
  .input-group input { width: 100%; padding: 12px; background: var(--panel-light); border: 1px solid var(--border); border-radius: 12px; color: #fff; outline: none; }
  .input-group input:focus { border-color: var(--orange); }
  .save-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--orange), var(--red)); border: none; border-radius: 12px; color: #fff; font-weight: bold; cursor: pointer; margin-top: 10px; }
</style>
</head>
<body>

<div class="stars"></div>
<canvas id="wave-canvas"></canvas>

<!-- Экран входа -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">☄️</div>
    <h1 class="login-title">Комета</h1>
    <p style="color: var(--text-muted); margin-bottom: 30px;">Быстрый, безопасный, твой.</p>
    <button class="google-btn" id="googleLoginBtn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      Войти через Google
    </button>
  </div>
</div>

<!-- Мессенджер -->
<div class="app-container" id="appContainer">
  <aside class="panel sidebar">
    <div class="sidebar-header">
      <div class="logo"><div class="logo-mark">☄️</div>Комета</div>
      <div class="user-avatar-sm" id="myAvatarBtn" title="Мой профиль">Я</div>
    </div>
    
    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" placeholder="Поиск (@BotKometa)...">
    </div>
    
    <div class="chat-list" id="chatList">
      <div class="chat-item active" onclick="switchChat('general', 'Общий чат', 'О', '#8b5cf6')">
        <div class="avatar" style="background: #8b5cf6;">О</div>
        <div class="chat-info"><div class="chat-name">Общий чат</div></div>
      </div>
    </div>
  </aside>

  <main class="chat-area">
    <header class="chat-header">
      <div class="chat-header-info">
        <div class="avatar" id="chatHeaderAvatar" style="background: #8b5cf6; width: 40px; height: 40px; font-size: 16px;">О</div>
        <div>
          <div class="chat-header-name" id="chatHeaderName">Общий чат</div>
          <div class="chat-header-sub" id="chatHeaderSub">Все пользователи</div>
        </div>
      </div>
    </header>
    
    <div class="messages" id="messagesContainer"></div>
    
    <div class="chat-input-area">
      <div class="input-wrapper">
        <button class="icon-btn" id="micBtn" title="Записать голосовое">🎤</button>
        <textarea class="input-field" id="messageInput" placeholder="Написать сообщение..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn">➤</button>
      </div>
    </div>
  </main>
</div>

<!-- Модалка профиля -->
<div class="modal" id="profileModal">
  <div class="modal-content">
    <h2>Настройки профиля</h2>
    <div class="avatar-preview" id="avatarPreview" onclick="document.getElementById('fileInput').click()">
      <input type="file" id="fileInput" accept="image/*" style="display: none;">
    </div>
    <div class="input-group">
      <label>Никнейм (Отображаемое имя)</label>
      <input type="text" id="nicknameInput" placeholder="Ваше имя">
    </div>
    <div class="input-group">
      <label>Юзернейм (как в Telegram)</label>
      <input type="text" id="usernameInput" placeholder="@username">
    </div>
    <button class="save-btn" id="saveProfileBtn">Сохранить</button>
    <button class="save-btn" style="background: transparent; color: var(--text-muted); margin-top: 5px;" onclick="document.getElementById('profileModal').classList.remove('active')">Отмена</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getDatabase, ref, push, onChildAdded, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // Твой конфиг
  const firebaseConfig = {
    apiKey: "AIzaSyBHbm84N2Bjed93Xb2ccpWPsCTW138wf64",
    authDomain: "kometanm.firebaseapp.com",
    databaseURL: "https://kometanm-default-rtdb.firebaseio.com",
    projectId: "kometanm",
    storageBucket: "kometanm.firebasestorage.app",
    messagingSenderId: "389756589729",
    appId: "1:389756589729:web:bc82b216570226bbf142e0"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const provider = new GoogleAuthProvider();

  // DOM
  const loginScreen = document.getElementById('loginScreen');
  const appContainer = document.getElementById('appContainer');
  const googleLoginBtn = document.getElementById('googleLoginBtn');
  const myAvatarBtn = document.getElementById('myAvatarBtn');
  const messagesContainer = document.getElementById('messagesContainer');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const searchInput = document.getElementById('searchInput');
  const chatList = document.getElementById('chatList');

  let currentUser = null;
  let userProfile = { nickname: 'Пользователь', username: '@user', avatar: '' };
  let currentChatId = 'general';
  let currentChatName = 'Общий чат';
  
  // Для записи голоса
  let mediaRecorder;
  let audioChunks = [];

  // ================= АВТОРИЗАЦИЯ =================
  googleLoginBtn.onclick = () => signInWithPopup(auth, provider).catch(err => alert(err.message));

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      
      // Загружаем или создаем профиль
      const userRef = ref(db, 'users/' + user.uid);
      const snapshot = await get(userRef);
      
      if (snapshot.exists()) {
        userProfile = snapshot.val();
      } else {
        userProfile = {
          nickname: user.displayName || 'Пользователь',
          username: '@' + (user.email ? user.email.split('@')[0] : 'user'),
          avatar: user.photoURL || ''
        };
        set(userRef, userProfile);
      }
      updateProfileUI();
      
      loginScreen.style.display = 'none';
      appContainer.classList.add('active');
      switchChat('general', 'Общий чат', 'О', '#8b5cf6');
    } else {
      loginScreen.style.display = 'flex';
      appContainer.classList.remove('active');
    }
  });

  // ================= ПРОФИЛЬ =================
  function updateProfileUI() {
    if (userProfile.avatar) {
      myAvatarBtn.innerHTML = `<img src="${userProfile.avatar}">`;
      document.getElementById('avatarPreview').style.backgroundImage = `url(${userProfile.avatar})`;
      document.getElementById('avatarPreview').textContent = '';
    } else {
      myAvatarBtn.textContent = userProfile.nickname[0].toUpperCase();
    }
    document.getElementById('nicknameInput').value = userProfile.nickname;
    document.getElementById('usernameInput').value = userProfile.username;
  }

  myAvatarBtn.onclick = () => document.getElementById('profileModal').classList.add('active');

  // Загрузка аватарки файлом
  document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
      const base64 = event.target.result;
      // Сжимаем через canvas для экономии места (опционально, но полезно)
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 100; canvas.height = 100;
        ctx.drawImage(img, 0, 0, 100, 100);
        const compressed = canvas.toDataURL('image/jpeg', 0.7);
        
        userProfile.avatar = compressed;
        updateProfileUI();
      };
      img.src = base64;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('saveProfileBtn').onclick = () => {
    const newNick = document.getElementById('nicknameInput').value.trim();
    let newUser = document.getElementById('usernameInput').value.trim();
    if (!newUser.startsWith('@')) newUser = '@' + newUser;
    
    if (newNick) userProfile.nickname = newNick;
    userProfile.username = newUser;
    
    set(ref(db, 'users/' + currentUser.uid), userProfile);
    updateProfileUI();
    document.getElementById('profileModal').classList.remove('active');
  };

  // ================= ЧАТЫ И БОТ =================
  searchInput.addEventListener('input', (e) => {
    const val = e.target.value.toLowerCase();
    const botExists = val.includes('@botkometa') || val.includes('botkometa');
    
    // Удаляем старую кнопку бота, если есть
    const oldBot = document.getElementById('botChatItem');
    if (oldBot) oldBot.remove();

    if (botExists) {
      const botDiv = document.createElement('div');
      botDiv.id = 'botChatItem';
      botDiv.className = 'chat-item';
      botDiv.innerHTML = `
        <div class="avatar" style="background: #ef4444;">🤖</div>
        <div class="chat-info"><div class="chat-name">BotKometa <span style="color:var(--orange); font-size:10px;">BOT</span></div></div>
      `;
      botDiv.onclick = () => switchChat('bot', 'BotKometa', '🤖', '#ef4444');
      chatList.appendChild(botDiv);
    }
  });

  function switchChat(chatId, name, avatar, color) {
    currentChatId = chatId;
    currentChatName = name;
    document.getElementById('chatHeaderName').textContent = name;
    document.getElementById('chatHeaderAvatar').textContent = avatar;
    document.getElementById('chatHeaderAvatar').style.background = color;
    document.getElementById('chatHeaderSub').textContent = chatId === 'bot' ? 'Официальный бот' : 'Все пользователи';
    
    messagesContainer.innerHTML = '';
    const messagesRef = ref(db, 'chats/' + currentChatId + '/messages');
    onChildAdded(messagesRef, (snapshot) => {
      const msg = snapshot.val();
      renderMessage(msg);
    });
  }

  // ================= ОТПРАВКА СООБЩЕНИЙ =================
  function renderMessage(msg) {
    const isMine = msg.uid === currentUser.uid;
    const msgEl = document.createElement('div');
    msgEl.className = `message ${isMine ? 'out' : 'in'}`;
    
    let authorHtml = !isMine ? `<div class="msg-author">${msg.nickname} <span>${msg.username}</span></div>` : '';
    let contentHtml = '';

    if (msg.type === 'voice') {
      contentHtml = `<div class="msg-bubble voice-msg"><audio controls src="${msg.audio}"></audio></div>`;
    } else {
      contentHtml = `<div class="msg-bubble">${msg.text}</div>`;
    }
    
    msgEl.innerHTML = `
      <div>
        ${authorHtml}
        ${contentHtml}
        <div class="msg-time">${msg.time}</div>
      </div>
    `;
    messagesContainer.appendChild(msgEl);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  function sendMessage(text, type = 'text', audioData = null) {
    if (!currentUser) return;
    const now = new Date();
    const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

    const msgData = {
      uid: currentUser.uid,
      nickname: userProfile.nickname,
      username: userProfile.username,
      time: timeStr,
      type: type
    };

    if (type === 'text') msgData.text = text;
    if (type === 'voice') msgData.audio = audioData;

    push(ref(db, 'chats/' + currentChatId + '/messages'), msgData);

    // ЛОГИКА БОТА
    if (currentChatId === 'bot' && type === 'text') {
      setTimeout(() => {
        const apiKey = 'KM-' + Math.random().toString(36).substring(2, 10).toUpperCase();
        push(ref(db, 'chats/bot/messages'), {
          uid: 'bot',
          nickname: 'BotKometa',
          username: '@BotKometa',
          time: new Date().toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'}),
          type: 'text',
          text: `Привет, ${userProfile.nickname}! Твой API ключ для интеграций: \n\n🔑 ${apiKey}\n\nНикому его не показывай.`
        });
      }, 1000);
    }
  }

  sendBtn.onclick = () => {
    const text = messageInput.value.trim();
    if (text) {
      sendMessage(text, 'text');
      messageInput.value = '';
      messageInput.style.height = 'auto';
    }
  };

  messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
  });

  // ================= ГОЛОСОВЫЕ СООБЩЕНИЯ =================
  micBtn.onclick = async () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      micBtn.classList.remove('recording');
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.onload = (e) => {
          sendMessage('', 'voice', e.target.result);
        };
        reader.readAsDataURL(audioBlob);
        stream.getTracks().forEach(track => track.stop());
      };

      mediaRecorder.start();
      micBtn.classList.add('recording');
    } catch (err) {
      alert("Нет доступа к микрофону. Разрешите его в браузере.");
    }
  };

  // ================= ВОЛНЫ =================
  const canvas = document.getElementById('wave-canvas');
  const ctx = canvas.getContext('2d');
  let width, height, time = 0;

  function resize() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
  window.addEventListener('resize', resize); resize();

  function drawWave() {
    ctx.clearRect(0, 0, width, height);
    const waves = [
      { amplitude: 40, frequency: 0.003, speed: 0.02, color: 'rgba(245, 158, 11, 0.15)' },
      { amplitude: 60, frequency: 0.002, speed: -0.015, color: 'rgba(239, 68, 68, 0.15)' }
    ];
    waves.forEach((wave) => {
      ctx.beginPath(); ctx.moveTo(0, height);
      for (let x = 0; x <= width; x += 5) {
        const y = Math.sin(x * wave.frequency + time * wave.speed) * wave.amplitude;
        ctx.lineTo(x, height * 0.8 + y); 
      }
      ctx.lineTo(width, height); ctx.lineTo(0, height);
      ctx.fillStyle = wave.color; ctx.fill();
    });
    time += 1; requestAnimationFrame(drawWave);
  }
  drawWave();
</script>
</body>
