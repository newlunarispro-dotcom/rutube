<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Комета — Мессенджер</title>
    <style>
        :root {
            --bg: #0b1120; --panel: rgba(30, 41, 59, 0.75);
            --text: #f8fafc; --text-muted: #94a3b8;
            --accent: #6366f1; --accent2: #8b5cf6;
            --msg-out: linear-gradient(135deg, #6366f1, #8b5cf6); --msg-in: #1e293b;
            --border: rgba(255, 255, 255, 0.1); --input-bg: rgba(0,0,0,0.25);
            --hover: rgba(255,255,255,0.08); --online: #22c55e;
        }
        [data-theme="light"] {
            --bg: #eef2f7; --panel: rgba(255, 255, 255, 0.8);
            --text: #0f172a; --text-muted: #64748b;
            --msg-in: #ffffff; --border: rgba(0,0,0,0.1); --input-bg: rgba(255,255,255,0.7);
            --hover: rgba(0,0,0,0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; transition: 0.3s; }
        *:focus { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

        /* Волны на фоне */
        #wave-canvas { position: fixed; bottom: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; pointer-events: none; opacity: 0.6; }
        
        .bg-blobs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
        .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.25; animation: float 12s infinite alternate ease-in-out; }
        .blob-1 { width: 450px; height: 450px; background: #6366f1; top: -120px; left: -120px; }
        .blob-2 { width: 350px; height: 350px; background: #ec4899; bottom: -80px; right: -80px; animation-delay: -6s; }
        @keyframes float { 100% { transform: translate(60px, 60px) scale(1.1); } }

        /* АВТОРИЗАЦИЯ */
        .auth-screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(10px); animation: fadeIn 0.4s; }
        .auth-box { background: var(--panel); border: 1px solid var(--border); padding: 40px 30px; border-radius: 28px; width: 400px; max-width: 90%; text-align: center; backdrop-filter: blur(20px); box-shadow: 0 25px 60px rgba(0,0,0,0.35); }
        .auth-logo { font-size: 42px; margin-bottom: 6px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
        .auth-tab { flex: 1; padding: 10px; cursor: pointer; color: var(--text-muted); font-weight: bold; transition: 0.2s; }
        .auth-tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
        .auth-input { width: 100%; padding: 14px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 14px; color: var(--text); margin-bottom: 12px; outline: none; font-size: 16px; transition: 0.2s; }
        .auth-input:focus { border-color: var(--accent); }
        .auth-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: 14px; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(99,102,241,0.4); }

        /* ПРИЛОЖЕНИЕ */
        .app { display: none; width: 100%; height: 100%; z-index: 10; }
        .app.active { display: flex; animation: fadeIn 0.3s; }

        .sidebar { width: 360px; background: var(--panel); backdrop-filter: blur(20px); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: 0.3s; }
        .header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .logo { font-weight: 800; font-size: 22px; background: linear-gradient(135deg, var(--accent), var(--accent2), #ec4899); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .avatar { position: relative; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; cursor: pointer; flex-shrink: 0; transition: 0.2s; }
        .avatar:hover { transform: scale(1.08); }
        .status-dot { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; border-radius: 50%; background: #64748b; border: 2px solid var(--bg); }
        .status-dot.online { background: var(--online); box-shadow: 0 0 8px var(--online); }
        .icon-btn { width: 38px; height: 38px; border-radius: 12px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); cursor: pointer; font-size: 16px; transition: 0.2s; }
        .icon-btn:hover { background: var(--accent); transform: rotate(15deg); }

        .search-area { padding: 12px; }
        .search-input { width: 100%; padding: 12px 18px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 22px; color: var(--text); outline: none; transition: 0.2s; }
        .search-input:focus { border-color: var(--accent); }

        .chat-list { flex: 1; overflow-y: auto; padding: 0 10px 10px; }
        .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; cursor: pointer; transition: 0.2s; margin-bottom: 4px; }
        .chat-item:hover, .chat-item.active { background: var(--hover); }
        .chat-item.active { box-shadow: inset 3px 0 0 var(--accent); }
        .chat-info { flex: 1; min-width: 0; }
        .chat-name { font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
        .chat-time { font-size: 11px; color: var(--text-muted); font-weight: 400; }
        .chat-preview { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
        .unread-badge { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: 11px; font-weight: bold; min-width: 20px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 0 6px; flex-shrink: 0; }
        .empty-hint { text-align: center; color: var(--text-muted); padding: 30px 15px; font-size: 14px; }

        .main { flex: 1; display: flex; flex-direction: column; position: relative; transition: 0.3s; }
        .chat-header { padding: 14px 24px; background: var(--panel); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .chat-header-info { display: flex; align-items: center; gap: 12px; }
        .chat-title { font-weight: bold; font-size: 17px; }
        .chat-subtitle { font-size: 12px; color: var(--online); height: 15px; transition: 0.2s; }
        .chat-subtitle.typing { color: var(--accent); font-weight: 600; }
        .chat-subtitle.offline { color: var(--text-muted); }
        
        .mobile-btn { display: none; background: transparent; border: none; color: var(--text); font-size: 22px; cursor: pointer; margin-right: 8px; }

        .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 4px; }
        .msg { max-width: 75%; display: flex; flex-direction: column; animation: slideUp 0.25s ease; position: relative; margin-top: 10px; }
        .msg.grouped { margin-top: 2px; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .msg.out { align-self: flex-end; align-items: flex-end; }
        .msg.in { align-self: flex-start; }
        .msg-bubble { padding: 10px 16px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-break: break-word; position: relative; }
        .msg.out .msg-bubble { background: var(--msg-out); color: #fff; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(99,102,241,0.3); }
        .msg.in .msg-bubble { background: var(--msg-in); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
        .msg-footer { font-size: 11px; color: var(--text-muted); padding: 3px 8px 0; display: flex; gap: 4px; align-items: center; }
        .msg.out .msg-footer { justify-content: flex-end; }
        
        /* Стили для фото и файлов */
        .msg-img { max-width: 260px; max-height: 260px; border-radius: 12px; cursor: zoom-in; display: block; }
        .msg-file { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 12px; text-decoration: none; color: inherit; border: 1px solid rgba(255,255,255,0.1); }
        .msg.out .msg-file { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
        .msg.in .msg-file { background: rgba(255,255,255,0.05); border-color: var(--border); }
        .file-icon { font-size: 24px; }
        .file-info { display: flex; flex-direction: column; min-width: 0; }
        .file-name { font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
        .file-size { font-size: 11px; opacity: 0.7; }

        .msg audio { max-width: 240px; height: 40px; }
        .reply-quote { font-size: 12px; border-left: 3px solid var(--accent); background: rgba(0,0,0,0.15); padding: 6px 10px; border-radius: 8px; margin-bottom: 6px; opacity: 0.9; }
        .msg.in .reply-quote { background: rgba(0,0,0,0.06); }
        
        .msg-actions { position: absolute; top: -12px; display: none; gap: 4px; z-index: 5; }
        .msg.out .msg-actions { left: -70px; } .msg.in .msg-actions { right: -70px; }
        .msg:hover .msg-actions { display: flex; }
        .msg-action-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; font-size: 12px; backdrop-filter: blur(10px); transition: 0.15s; }
        .msg-action-btn:hover { background: var(--accent); color: #fff; transform: scale(1.15); }
        .read-status { font-size: 11px; }

        .typing-indicator { display: flex; gap: 4px; padding: 12px 18px; align-self: flex-start; }
        .typing-indicator span { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; } .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 60%, 100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }

        .input-area { padding: 12px 24px 16px; background: var(--panel); border-top: 1px solid var(--border); }
        .reply-bar { display: none; align-items: center; justify-content: space-between; gap: 10px; background: var(--input-bg); border-left: 3px solid var(--accent); border-radius: 10px; padding: 8px 14px; margin-bottom: 8px; font-size: 13px; }
        .reply-bar.active { display: flex; animation: slideUp 0.2s; }
        .reply-bar-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-muted); }
        .input-row { display: flex; gap: 8px; align-items: flex-end; }
        .input-field { flex: 1; padding: 12px 20px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 22px; color: var(--text); outline: none; font-size: 15px; resize: none; max-height: 120px; font-family: inherit; line-height: 1.4; }
        .input-field:focus { border-color: var(--accent); }
        .send-btn { padding: 0 22px; height: 44px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: 22px; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
        .send-btn:hover { transform: scale(1.08); box-shadow: 0 8px 20px rgba(99,102,241,0.4); }
        .attach-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); cursor: pointer; font-size: 18px; transition: 0.2s; flex-shrink: 0; }
        .attach-btn:hover { background: var(--accent); color: #fff; }
        .attach-btn.recording { background: #ef4444; color: #fff; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { transform: scale(1.15); box-shadow: 0 0 20px rgba(239,68,68,0.6); } }

        .emoji-panel { display: none; position: absolute; bottom: 80px; left: 24px; background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 12px; backdrop-filter: blur(20px); grid-template-columns: repeat(8, 1fr); gap: 4px; z-index: 50; box-shadow: 0 15px 40px rgba(0,0,0,0.3); }
        .emoji-panel.active { display: grid; animation: slideUp 0.2s; }
        .emoji-item { font-size: 20px; padding: 5px; cursor: pointer; border-radius: 8px; text-align: center; transition: 0.15s; }
        .emoji-item:hover { background: var(--accent); transform: scale(1.2); }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 12px 24px; border-radius: 14px; z-index: 2000; backdrop-filter: blur(20px); transition: 0.4s; font-weight: 500; box-shadow: 0 15px 40px rgba(0,0,0,0.3); }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* МОБИЛЬНАЯ ВЕРСИЯ */
        @media (max-width: 768px) {
            .sidebar { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; z-index: 100; transition: 0.3s; }
            .main { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; z-index: 200; transition: 0.3s; transform: translateX(100%); }
            .main.active { transform: translateX(0); }
            .mobile-btn { display: block; }
            .msg-actions { position: static; display: flex; margin-bottom: 4px; opacity: 0.7; }
            .msg.out .msg-actions { justify-content: flex-end; }
        }
    </style>
</head>
<body>
    <canvas id="wave-canvas"></canvas>
    <div class="bg-blobs">
        <div class="blob blob-1"></div><div class="blob blob-2"></div>
    </div>

    <!-- АВТОРИЗАЦИЯ -->
    <div class="auth-screen" id="authScreen">
        <div class="auth-box">
            <div class="auth-logo">☄️</div>
            <h2 style="margin-bottom: 4px;">Комета</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 14px;">Мессенджер нового поколения</p>
            <div class="auth-tabs">
                <div class="auth-tab active" id="tabLogin" onclick="switchAuth('login')">Вход</div>
                <div class="auth-tab" id="tabReg" onclick="switchAuth('reg')">Регистрация</div>
            </div>
            <div id="formLogin">
                <input type="email" id="loginEmail" class="auth-input" placeholder="Email" autocomplete="email">
                <input type="password" id="loginPass" class="auth-input" placeholder="Пароль" autocomplete="current-password" onkeypress="if(event.key==='Enter')doLogin()">
                <button class="auth-btn" onclick="doLogin()">Войти 🚀</button>
            </div>
            <div id="formReg" style="display: none;">
                <input type="text" id="regNick" class="auth-input" placeholder="Ваш никнейм (уникальный)">
                <input type="email" id="regEmail" class="auth-input" placeholder="Email">
                <input type="password" id="regPass" class="auth-input" placeholder="Пароль (мин. 6 символов)" onkeypress="if(event.key==='Enter')doRegister()">
                <button class="auth-btn" onclick="doRegister()">Создать аккаунт ✨</button>
            </div>
        </div>
    </div>

    <!-- ПРИЛОЖЕНИЕ -->
    <div class="app" id="app">
        <!-- САЙДБАР -->
        <aside class="sidebar" id="sidebar">
            <div class="header">
                <div class="logo">☄️ Комета</div>
                <div class="header-actions">
                    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Сменить тему">🌙</button>
                    <div class="avatar" id="myAvatar" title="Выйти" style="background: linear-gradient(135deg, #6366f1, #ec4899);">Г</div>
                </div>
            </div>
            <div class="search-area">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск людей..." oninput="renderSidebar()">
            </div>
            <div class="chat-list" id="chatList"></div>
        </aside>

        <!-- ОСНОВНОЙ ЧАТ -->
        <main class="main" id="mainChat">
            <div class="chat-header">
                <div class="chat-header-info" id="chatHeaderInfo" style="display: none;">
                    <button class="mobile-btn" onclick="closeChatMobile()">←</button>
                    <div class="avatar" id="chatAvatar" style="width: 40px; height: 40px; background: linear-gradient(135deg, #06b6d4, #8b5cf6);">?</div>
                    <div>
                        <div class="chat-title" id="chatTitle">Выберите чат</div>
                        <div class="chat-subtitle offline" id="chatSubtitle"></div>
                    </div>
                </div>
                <div class="chat-title" id="placeholderTitle" style="color: var(--text-muted); font-weight: 500;">Выберите чат или найдите собеседника 🔍</div>
            </div>

            <div class="messages" id="messages"></div>

            <div class="input-area" id="inputArea" style="display: none;">
                <div class="reply-bar" id="replyBar">
                    <div style="min-width: 0;"><b id="replyBarName"></b><div class="reply-bar-text" id="replyBarText"></div></div>
                    <button class="msg-action-btn" onclick="cancelReply()">✕</button>
                </div>
                <div class="input-row">
                    <button class="attach-btn" onclick="toggleEmoji()" title="Эмодзи">😊</button>
                    <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Отправить файл">📎</button>
                    <button class="attach-btn" id="voiceBtn" onclick="toggleVoice()" title="Голосовое сообщение">🎤</button>
                    <textarea id="msgInput" class="input-field" rows="1" placeholder="Написать сообщение..."></textarea>
                    <button class="send-btn" onclick="sendMsg()">➤</button>
                </div>
            </div>
            <div class="emoji-panel" id="emojiPanel"></div>
            <!-- Изменено: accept="*/*", чтобы принимать любые файлы -->
            <input type="file" id="fileInput" accept="*/*" style="display: none;" onchange="sendFile(this)">
        </main>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue, set, get, remove, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBHbm84N2Bjed93Xb2ccpWPsCTW138wf64",
            authDomain: "kometanm.firebaseapp.com",
            databaseURL: "https://kometanm-default-rtdb.firebaseio.com",
            projectId: "kometanm",
            storageBucket: "kometanm.firebasestorage.app",
            messagingSenderId: "389756589729",
            appId: "1:389756589729:web:bc82b216570226bbf142e0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const $ = id => document.getElementById(id);

        let currentUser = null, myProfile = null, currentChat = null;
        let allUsers = {}, myPrivateChats = {}, allMessages = {};
        let bootTime = Date.now(), totalUnread = 0;
        let msgsUnsub = null, typingUnsub = null;
        let replyTarget = null, typingTimeout = null;
        let mediaRecorder = null, audioChunks = [], recording = false;

        // === УТИЛИТЫ ===
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        window.toast = (text) => {
            const t = $('toast'); t.textContent = text; t.classList.add('show');
            clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 2500);
        };

        const AVATAR_GRADIENTS = [
            'linear-gradient(135deg,#6366f1,#8b5cf6)', 'linear-gradient(135deg,#06b6d4,#3b82f6)',
            'linear-gradient(135deg,#ec4899,#f43f5e)', 'linear-gradient(135deg,#22c55e,#84cc16)',
            'linear-gradient(135deg,#f59e0b,#ef4444)', 'linear-gradient(135deg,#8b5cf6,#ec4899)'
        ];
        const avatarGradient = nick => AVATAR_GRADIENTS[[...nick].reduce((a,c)=>a+c.charCodeAt(0),0) % AVATAR_GRADIENTS.length];

        const fmtTime = ts => { const d = new Date(ts); const now = new Date();
            const sameDay = d.toDateString() === now.toDateString();
            const hm = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
            return sameDay ? hm : d.getDate().toString().padStart(2,'0') + '.' + (d.getMonth()+1).toString().padStart(2,'0'); };

        function beep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const o = ctx.createOscillator(), g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.frequency.value = 880; g.gain.value = 0.06;
                o.start(); o.frequency.setValueAtTime(660, ctx.currentTime + 0.12);
                g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.3);
                o.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        }

        async function notify(title, body) {
            if (!('Notification' in window)) return;
            if (Notification.permission === 'default') await Notification.requestPermission();
            if (Notification.permission === 'granted') new Notification(title, { body });
        }

        // === ТЕМА ===
        window.toggleTheme = () => {
            const html = document.documentElement;
            const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
            html.dataset.theme = next;
            localStorage.setItem('cometa-theme', next);
            $('themeBtn').textContent = next === 'dark' ? '🌙' : '☀️';
        };
        const savedTheme = localStorage.getItem('cometa-theme');
        if (savedTheme) { document.documentElement.dataset.theme = savedTheme; }

        // === АВТОРИЗАЦИЯ ===
        window.switchAuth = (type) => {
            $('tabLogin').classList.toggle('active', type === 'login');
            $('tabReg').classList.toggle('active', type === 'reg');
            $('formLogin').style.display = type === 'login' ? 'block' : 'none';
            $('formReg').style.display = type === 'reg' ? 'block' : 'none';
        };

        window.doRegister = async () => {
            const nick = $('regNick').value.trim();
            const email = $('regEmail').value.trim();
            const pass = $('regPass').value;
            if (!nick || !email || !pass) return toast("Заполните все поля!");
            if (pass.length < 6) return toast("Пароль должен быть от 6 символов!");
            try {
                const usersSnap = await get(ref(db, 'users'));
                const users = usersSnap.val() || {};
                if (Object.values(users).some(u => u.nickname.toLowerCase() === nick.toLowerCase()))
                    return toast("Этот никнейм уже занят!");
                const cred = await createUserWithEmailAndPassword(auth, email, pass);
                await set(ref(db, 'users/' + cred.user.uid), { uid: cred.user.uid, nickname: nick, email: email });
                toast("Аккаунт создан! Добро пожаловать ☄️");
            } catch (err) { toast("Ошибка: " + err.message); }
        };

        window.doLogin = async () => {
            try {
                await signInWithEmailAndPassword(auth, $('loginEmail').value.trim(), $('loginPass').value);
            } catch (err) { toast("Ошибка входа: " + err.message); }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                bootTime = Date.now();
                const snap = await get(ref(db, 'users/' + user.uid));
                if (snap.exists()) myProfile = snap.val();

                const presenceRef = ref(db, 'users/' + user.uid + '/online');
                set(presenceRef, true);
                onDisconnect(presenceRef).set(false);
                onDisconnect(ref(db, 'users/' + user.uid + '/lastActive')).set(serverTimestamp());

                $('authScreen').style.display = 'none';
                $('app').classList.add('active');
                $('themeBtn').textContent = document.documentElement.dataset.theme === 'dark' ? '🌙' : '☀️';
                const av = $('myAvatar');
                av.textContent = myProfile.nickname[0].toUpperCase();
                av.style.background = avatarGradient(myProfile.nickname);
                av.title = myProfile.nickname + ' (нажмите, чтобы выйти)';
                
                av.onclick = async () => { 
                    if (confirm('Выйти из аккаунта?')) { 
                        await set(presenceRef, false); 
                        signOut(auth).then(() => {
                            $('authScreen').style.display = 'flex';
                            $('app').classList.remove('active');
                        });
                    } 
                };

                loadData();
                if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
            } else {
                $('authScreen').style.display = 'flex';
                $('app').classList.remove('active');
            }
        });

        // === ЗАГРУЗКА ДАННЫХ ===
        function loadData() {
            onValue(ref(db, 'users'), s => { allUsers = s.val() || {}; renderSidebar(); renderHeaderStatus(); });
            onValue(ref(db, 'user_chats/' + currentUser.uid), s => { myPrivateChats = s.val() || {}; renderSidebar(); });
            onValue(ref(db, 'messages'), s => {
                allMessages = s.val() || {};
                renderSidebar();
                if (currentChat) renderMessages(false);
            });
        }

        // === САЙДБАР ===
        window.renderSidebar = () => {
            const q = $('searchInput').value.toLowerCase().trim();
            const list = $('chatList');
            list.innerHTML = '';
            totalUnread = 0;
            const items = [];

            const collect = (chatId, u) => {
                const msgs = allMessages[chatId] ? Object.values(allMessages[chatId]) : [];
                const lastMsg = msgs.sort((a,b) => a.ts - b.ts).pop();
                const lastRead = myPrivateChats[chatId] || 0;
                const unread = msgs.filter(m => m.uid !== currentUser.uid && m.ts > lastRead).length;
                totalUnread += unread;
                items.push({ chatId, u, lastMsg, unread, ts: lastMsg ? lastMsg.ts : 0 });
            };

            if (q === '') {
                for (const chatId in myPrivateChats) {
                    const otherUid = chatId.split('_').find(id => id !== currentUser.uid);
                    if (allUsers[otherUid]) collect(chatId, allUsers[otherUid]);
                }
                items.sort((a,b) => b.ts - a.ts);
            } else {
                for (const uid in allUsers) {
                    if (uid === currentUser.uid) continue;
                    const u = allUsers[uid];
                    if (u.nickname.toLowerCase().includes(q)) collect([currentUser.uid, uid].sort().join('_'), u);
                }
            }

            document.title = totalUnread > 0 ? `(${totalUnread}) Комета` : 'Комета — Мессенджер';

            if (items.length === 0) {
                list.innerHTML = '<div class="empty-hint">' + (q ? 'Никого не найдено 😔' : 'Чатов пока нет.<br>Найдите собеседника поиском выше! 🔍') + '</div>';
                return;
            }
            items.forEach(({ chatId, u, lastMsg, unread }) => {
                const div = document.createElement('div');
                div.className = 'chat-item' + (currentChat && currentChat.chatId === chatId ? ' active' : '');
                const preview = lastMsg
                    ? (lastMsg.type === 'image' ? '📷 Фото' : lastMsg.type === 'file' ? '📎 Файл' : lastMsg.type === 'voice' ? '🎤 Голосовое' : esc(lastMsg.text.slice(0, 40)))
                    : 'Начните общение ✨';
                div.innerHTML = `
                    <div class="avatar" style="background: ${avatarGradient(u.nickname)}">${esc(u.nickname[0].toUpperCase())}
                        <div class="status-dot ${u.online ? 'online' : ''}"></div></div>
                    <div class="chat-info">
                        <div class="chat-name"><span>${esc(u.nickname)}</span><span class="chat-time">${lastMsg ? fmtTime(lastMsg.ts) : ''}</span></div>
                        <div class="chat-preview"><span>${preview}</span>${unread ? `<span class="unread-badge">${unread}</span>` : ''}</div>
                    </div>`;
                div.onclick = () => openChat(chatId, u.nickname, u.uid);
                list.appendChild(div);
            });
        };

        // === СТАТУС СОБЕСЕДНИКА ===
        function renderHeaderStatus() {
            if (!currentChat) return;
            const u = allUsers[currentChat.targetUid];
            const sub = $('chatSubtitle');
            if (!u) return;
            if (typingUsers[currentChat.chatId]) { sub.textContent = 'печатает...'; sub.className = 'chat-subtitle typing'; return; }
            if (u.online) { sub.textContent = '● онлайн'; sub.className = 'chat-subtitle'; }
            else { sub.textContent = 'был(а) недавно'; sub.className = 'chat-subtitle offline'; }
        }

        // === ТАЙПИНГ ===
        let typingUsers = {};
        window.onTyping = () => {
            if (!currentChat) return;
            set(ref(db, 'typing/' + currentChat.chatId + '/' + currentUser.uid), Date.now());
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => remove(ref(db, 'typing/' + currentChat.chatId + '/' + currentUser.uid)), 2500);
        };

        // === ЧАТ ===
        window.openChat = (chatId, name, targetUid) => {
            currentChat = { chatId, name, targetUid };
            replyTarget = null; $('replyBar').classList.remove('active');
            $('chatTitle').textContent = name;
            $('chatAvatar').textContent = name[0].toUpperCase();
            $('chatAvatar').style.background = avatarGradient(name);
            $('chatHeaderInfo').style.display = 'flex';
            $('placeholderTitle').style.display = 'none';
            $('inputArea').style.display = 'block';
            $('msgInput').focus();
            renderSidebar();
            renderHeaderStatus();

            if (window.innerWidth <= 768) {
                $('mainChat').classList.add('active');
            }

            set(ref(db, 'user_chats/' + currentUser.uid + '/' + chatId), Date.now());
            set(ref(db, 'user_chats/' + targetUid + '/' + chatId), (myPrivateChats[chatId] || Date.now()));

            if (msgsUnsub) msgsUnsub();
            msgsUnsub = onValue(ref(db, 'messages/' + chatId), () => renderMessages(false));
            if (typingUnsub) typingUnsub();
            typingUnsub = onValue(ref(db, 'typing/' + chatId), s => {
                const data = s.val() || {};
                delete data[currentUser.uid];
                typingUsers = {}; 
                const now = Date.now();
                for (const uid in data) if (now - data[uid] < 4000) typingUsers[chatId] = true;
                renderMessages(false); renderHeaderStatus();
            });
        };

        window.closeChatMobile = () => {
            $('mainChat').classList.remove('active');
        };

        // === ОТРИСОВКА СООБЩЕНИЙ ===
        function bubbleHtml(id, m, prev) {
            const out = m.uid === currentUser.uid;
            const grouped = prev && prev.uid === m.uid && m.ts - prev.ts < 60 * 1000;
            const time = fmtTime(m.ts);
            
            let status = '';
            if (out && currentChat) {
                const peerLastRead = (window._peerReadStore && window._peerReadStore[currentChat.chatId]) || 0;
                status = `<span class="read-status">${peerLastRead >= m.ts ? '✓✓' : '✓'}</span>`;
            }

            let content = '';
            if (m.type === 'image') {
                content = `<img class="msg-img" src="${m.data}" onclick="window.open('${m.data}')" alt="фото">`;
            } else if (m.type === 'file') {
                content = `<a href="${m.data}" download="${esc(m.name)}" class="msg-file">
                    <div class="file-icon">📄</div>
                    <div class="file-info">
                        <div class="file-name">${esc(m.name)}</div>
                        <div class="file-size">${(m.size / 1024).toFixed(1)} КБ</div>
                    </div>
                </a>`;
            } else if (m.type === 'voice') {
                content = `<audio controls src="${m.data}"></audio>`;
            } else {
                content = esc(m.text);
            }

            let quote = '';
            if (m.replyTo) quote = `<div class="reply-quote"><b>${esc(m.replyTo.name)}:</b> ${esc((m.replyTo.text || '').slice(0, 80))}</div>`;

            const actions = `<div class="msg-actions">
                <button class="msg-action-btn" onclick="setReply('${id}')" title="Ответить">↩</button>
                ${out ? `<button class="msg-action-btn" onclick="deleteMsg('${id}')" title="Удалить">🗑</button>` : ''}
            </div>`;

            return `<div class="msg ${out ? 'out' : 'in'} ${grouped ? 'grouped' : ''}">${actions}
                <div class="msg-bubble">${quote}${content}</div>
                <div class="msg-footer"><span>${time}</span>${status}</div></div>`;
        }

        function renderMessages(forceScroll) {
            if (!currentChat) return;
            const wrap = $('messages');
            const nearBottom = forceScroll || (wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 150);
            const msgs = allMessages[currentChat.chatId]
                ? Object.entries(allMessages[currentChat.chatId]).sort((a, b) => a[1].ts - b[1].ts) : [];
            let html = msgs.map(([id, m], i) => bubbleHtml(id, m, i > 0 ? msgs[i-1][1] : null)).join('');
            if (typingUsers[currentChat.chatId]) html += '<div class="msg in grouped"><div class="msg-bubble typing-indicator"><span></span><span></span><span></span></div></div>';
            wrap.innerHTML = html;
            if (nearBottom) wrap.scrollTop = wrap.scrollHeight;
            set(ref(db, 'user_chats/' + currentUser.uid + '/' + currentChat.chatId), Date.now());
            renderSidebar();
        }

        window._peerReadStore = {};
        onValue(ref(db, 'user_chats'), s => { 
            window._peerReadStore = s.val() || {}; 
            if (currentChat) renderMessages(false);
        });

        window.setReply = (msgId) => {
            const m = allMessages[currentChat.chatId] && allMessages[currentChat.chatId][msgId];
            if (!m) return;
            replyTarget = { id: msgId, name: m.uid === currentUser.uid ? 'Вы' : currentChat.name, text: m.text || (m.type === 'image' ? '📷 Фото' : m.type === 'file' ? '📎 Файл' : '🎤 Голосовое') };
            $('replyBarName').textContent = replyTarget.name;
            $('replyBarText').textContent = replyTarget.text;
            $('replyBar').classList.add('active');
            $('msgInput').focus();
        };
        window.cancelReply = () => { replyTarget = null; $('replyBar').classList.remove('active'); };

        window.deleteMsg = async (msgId) => {
            if (!confirm('Удалить сообщение?')) return;
            await remove(ref(db, 'messages/' + currentChat.chatId + '/' + msgId));
        };

        function pushMessage(obj) {
            if (replyTarget) { obj.replyTo = replyTarget; replyTarget = null; $('replyBar').classList.remove('active'); }
            push(ref(db, 'messages/' + currentChat.chatId), obj);
            remove(ref(db, 'typing/' + currentChat.chatId + '/' + currentUser.uid));
        }

        window.sendMsg = () => {
            const text = $('msgInput').value.trim();
            if (!text || !currentChat) return;
            pushMessage({ uid: currentUser.uid, text, ts: Date.now() });
            $('msgInput').value = ''; $('msgInput').style.height = 'auto';
        };

        const input = $('msgInput');
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
        });
        input.addEventListener('input', () => {
            input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px';
            onTyping();
        });

        let firstMsgSnapshot = true;
        onValue(ref(db, 'messages'), s => {
            if (firstMsgSnapshot) { firstMsgSnapshot = false; return; }
            const data = s.val() || {};
            for (const chatId in data) {
                for (const id in data[chatId]) {
                    const m = data[chatId][id];
                    if (m.uid === currentUser.uid || !m.ts || m.ts < bootTime) continue;
                    if (currentChat && currentChat.chatId === chatId && !document.hidden) continue;
                    const otherUid = chatId.split('_').find(x => x !== currentUser.uid);
                    const name = allUsers[otherUid] ? allUsers[otherUid].nickname : 'Собеседник';
                    if (m._notified !== id) {
                        if (window._lastNotified !== id) {
                            window._lastNotified = id;
                            beep();
                            notify(name, m.type === 'image' ? '📷 Фото' : m.type === 'file' ? '📎 Файл' : m.type === 'voice' ? '🎤 Голосовое' : m.text.slice(0, 80));
                        }
                    }
                }
            }
        });

        const EMOJIS = '😀 😁 😂 🤣 😊 😍 😘 😎 🤔 😅 😉 😢 😭 😡 🥳 🤯 😴 🤝 👍 👎 👏 🙏 💪 ❤️ 🔥 🎉 ✨ 💯 ⭐ 🚀 ☄️ ⚡ 🌈 ☀️ 🌙 💡 🎵 🍕 🎂 ☕'.split(' ');
        const panel = $('emojiPanel');
        EMOJIS.forEach(e => {
            const d = document.createElement('div');
            d.className = 'emoji-item'; d.textContent = e;
            d.onclick = () => { input.value += e + ' '; input.focus(); toggleEmoji(); };
            panel.appendChild(d);
        });
        window.toggleEmoji = () => panel.classList.toggle('active');
        document.addEventListener('click', e => {
            if (!panel.contains(e.target) && e.target !== $('emojiBtn') && !e.target.closest('.attach-btn')) panel.classList.remove('active');
        });

        // === ОТПРАВКА ФАЙЛОВ (И ФОТО) ===
        window.sendFile = (el) => {
            const file = el.files[0];
            el.value = '';
            if (!file || !currentChat) return;
            
            // Лимит 500 КБ, чтобы не превысить лимиты Firebase Base64
            if (file.size > 500 * 1024) return toast('Файл слишком большой (макс. 500 КБ)');

            const reader = new FileReader();
            reader.onload = ev => {
                const dataUrl = ev.target.result;
                if (file.type.startsWith('image/')) {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = Math.min(1, 1024 / Math.max(img.width, img.height));
                        canvas.width = img.width * scale; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        const compressed = canvas.toDataURL('image/jpeg', 0.7);
                        if (compressed.length > 900 * 1024) return toast('Не удалось сжать фото, попробуйте другое');
                        pushMessage({ uid: currentUser.uid, type: 'image', data: compressed, ts: Date.now() });
                    };
                    img.src = dataUrl;
                } else {
                    if (dataUrl.length > 900 * 1024) return toast('Файл слишком большой для базы');
                    pushMessage({ uid: currentUser.uid, type: 'file', name: file.name, size: file.size, data: dataUrl, ts: Date.now() });
                }
            };
            reader.readAsDataURL(file);
        };

        window.toggleVoice = async () => {
            if (recording) { mediaRecorder.stop(); return; }
            if (!currentChat) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    stream.getTracks().forEach(t => t.stop());
                    recording = false;
                    $('voiceBtn').classList.remove('recording');
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    if (blob.size < 1000) return;
                    if (blob.size > 900 * 1024) return toast('Голосовое слишком длинное');
                    const r = new FileReader();
                    r.onload = ev => pushMessage({ uid: currentUser.uid, type: 'voice', data: ev.target.result, ts: Date.now() });
                    r.readAsDataURL(blob);
                };
                mediaRecorder.start();
                recording = true;
                $('voiceBtn').classList.add('recording');
                toast('🎤 Запись... нажмите ещё раз, чтобы отправить');
            } catch (e) { toast('Нет доступа к микрофону'); }
        };

        // ================= КАНВАС (ВОЛНЫ) =================
        const canvas = document.getElementById('wave-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, time = 0;
        
        function resize() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
        window.addEventListener('resize', resize); resize();
        
        function drawWave() {
            ctx.clearRect(0, 0, width, height);
            const waves = [
                { amplitude: 40, frequency: 0.003, speed: 0.02, color: 'rgba(99, 102, 241, 0.15)' },
                { amplitude: 60, frequency: 0.002, speed: -0.015, color: 'rgba(139, 92, 246, 0.15)' }
            ];
            waves.forEach((wave) => {
                ctx.beginPath(); ctx.moveTo(0, height);
                for (let x = 0; x <= width; x += 5) {
                    const y = Math.sin(x * wave.frequency + time * wave.speed) * wave.amplitude;
                    ctx.lineTo(x, height * 0.8 + y); 
                }
                ctx.lineTo(width, height); ctx.lineTo(0, height);
                ctx.fillStyle = wave.color; ctx.fill();
            });
            time += 1; requestAnimationFrame(drawWave);
        }
        drawWave();
    </script>
</body>
</html>
