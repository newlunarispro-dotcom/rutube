<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ограбление Века (Финал)</title>
<style>
  body { background: #050505; color: #fff; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
  .card { background: #111; border: 1px solid #f00; border-radius: 20px; padding: 20px; width: 100%; max-width: 600px; box-shadow: 0 0 30px rgba(255,0,0,0.2); text-align: center; }
  h2 { color: #f00; font-size: 22px; margin-top: 0; text-transform: uppercase; }
  button { width: 100%; padding: 16px; border-radius: 8px; font-size: 18px; background: linear-gradient(90deg, #f00, #ff8800); color: #fff; border: none; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
  button:disabled { opacity: 0.5; }
  #status { font-size: 15px; color: #0ff; font-weight: bold; margin-bottom: 15px; min-height: 20px; }
  video { width: 100%; border-radius: 10px; display: none; margin-top: 15px; border: 2px solid #0f0; }
</style>
</head>
<body>
<div class="card">
  <h2>🎬 Ограбление Века</h2>
  <p style="color:#aaa; font-size:14px; margin-bottom: 15px;">
    Жми кнопку. Когда спросит микрофон — выбери CABLE Output.
  </p>
  <button id="btn">▶ Создать видео</button>
  <div id="status">Готов к запуску</div>
  <video id="vid" controls playsinline></video>
</div>

<script>
const W=1280, H=720, FPS=30; 
const DUR=60; 
const cv=document.createElement('canvas'), cx=cv.getContext('2d');
cv.width=W; cv.height=H;
const btn=document.getElementById('btn'), st=document.getElementById('status'), vid=document.getElementById('vid');

let voices = [];
const script = [
  { role: "Рассказчик", text: "Полночь. Банк. Трое друзей готовы на всё.", scene: "bank" },
  { role: "Босс", text: "Так, мы на месте. Новичок, ты взял мешок?", scene: "bank" },
  { role: "Новичок", text: "Э-э... Я думал, ты возьмешь!", scene: "bank" },
  { role: "Босс", text: "Ты издеваешься?!", scene: "bank" },
  { role: "Рассказчик", text: "Тут в банк зашел случайный прохожий.", scene: "bank" },
  { role: "Прохожий", text: "О, привет! Это флешмоб? Я тоже хочу!", scene: "bank" },
  { role: "Босс", text: "Какой флешмоб?! Мы грабим банк! Ложись!", scene: "bank" },
  { role: "Рассказчик", text: "Новичок испугался, выронил пистолет и раздался выстрел!", scene: "shot" },
  { role: "Новичок", text: "Ой! Оно само!", scene: "shot" },
  { role: "Рассказчик", text: "Приехала полиция. Грабители бросились бежать!", scene: "escape" },
  { role: "Босс", text: "Нас сдали! Уходим!", scene: "escape" },
  { role: "Рассказчик", text: "Их поймали через пять минут. Продолжение следует...", scene: "outside" }
];

// ФИКС ГОЛОСОВ: Если голосов меньше 4, берем первый попавшийся
function loadVoices() {
  const all = speechSynthesis.getVoices();
  const ru = all.filter(v => v.lang.includes('ru'));
  const pool = ru.length > 0 ? ru : all;
  
  const v1 = pool[0] || null;
  const v2 = pool[1] || pool[0] || null;
  const v3 = pool[2] || pool[1] || pool[0] || null;
  const v4 = pool[3] || pool[2] || pool[1] || pool[0] || null;

  voices = {
    "Рассказчик": v1,
    "Босс": v2,
    "Новичок": v3,
    "Прохожий": v4
  };
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

let currentScene = "bank";
let flashEffect = 0;
let currentLine = null;

function drawCharacter(x, y, color, phase, isRunning) {
  cx.save(); cx.translate(x, y);
  cx.strokeStyle = color; cx.fillStyle = color; cx.lineWidth = 6; cx.lineCap = 'round';
  cx.beginPath(); cx.arc(0, -50, 14, 0, Math.PI*2); cx.fill();
  cx.beginPath(); cx.moveTo(0, -36); cx.lineTo(0, 10); cx.stroke();
  const arm = Math.sin(phase * (isRunning ? 25 : 8)) * (isRunning ? 1.2 : 0.6);
  cx.beginPath(); cx.moveTo(0, -25); cx.lineTo(20*Math.cos(arm), -25 + 20*Math.sin(arm)); cx.stroke();
  cx.beginPath(); cx.moveTo(0, -25); cx.lineTo(-20*Math.cos(arm), -25 + 20*Math.sin(arm)); cx.stroke();
  cx.beginPath(); cx.moveTo(0, 10); cx.lineTo(15*Math.sin(arm), 40); cx.stroke();
  cx.beginPath(); cx.moveTo(0, 10); cx.lineTo(-15*Math.sin(arm), 40); cx.stroke();
  cx.restore();
}

function drawScene(t) {
  if (currentScene === "bank" || currentScene === "shot") {
    const bg = cx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#1a1a2a'); bg.addColorStop(1, '#0a0a15');
    cx.fillStyle = bg; cx.fillRect(0, 0, W, H);
    cx.fillStyle = '#2a2a3a'; cx.fillRect(0, H-150, W, 150);
    const col = cx.createLinearGradient(150, 0, 230, 0);
    col.addColorStop(0, '#b8860b'); col.addColorStop(0.5, '#ffd700'); col.addColorStop(1, '#b8860b');
    cx.fillStyle = col; cx.fillRect(150, 100, 80, H-250); cx.fillRect(W-230, 100, 80, H-250); cx.fillRect(W/2-40, 100, 80, H-250);
    cx.fillStyle = '#ffd700'; cx.font = 'bold 40px serif'; cx.textAlign = 'center'; cx.fillText('ЦЕНТРАЛЬНЫЙ БАНК', W/2, 80);
    const sx = W - 350, sy = 250, sr = 150;
    cx.fillStyle = '#222'; cx.beginPath(); cx.arc(sx, sy, sr + 10, 0, Math.PI*2); cx.fill();
    cx.fillStyle = '#666'; cx.beginPath(); cx.arc(sx, sy, sr, 0, Math.PI*2); cx.fill();
    cx.strokeStyle = '#111'; cx.lineWidth = 15; cx.beginPath(); cx.arc(sx, sy, 50, 0, Math.PI*2); cx.stroke();
  } else {
    cx.fillStyle = '#0a0a1a'; cx.fillRect(0, 0, W, H);
    cx.fillStyle = '#151525'; cx.fillRect(W/2 - 400, 100, 800, 450);
    cx.fillStyle = '#111'; cx.fillRect(0, H-150, W, 150);
  }

  const isEscaping = currentScene === "escape" || currentScene === "outside";
  const colors = ["#ff3333", "#33ff33", "#33ffff"];
  const names = ["Босс", "Новичок", "Прохожий"];
  for (let i = 0; i < 3; i++) {
    let px = !isEscaping ? 350 + i * 120 : W - 200 - (t % 4) * 100 - i * 100;
    drawCharacter(px, H - 150, colors[i], t + i*2, isEscaping);
    cx.fillStyle = colors[i]; cx.font = 'bold 20px sans-serif'; cx.textAlign = 'center';
    cx.fillText(names[i], px, H - 230);
  }

  if (flashEffect > 0) {
    cx.fillStyle = `rgba(255, 255, 255, ${flashEffect})`;
    cx.fillRect(0, 0, W, H);
    flashEffect -= 0.1;
  }

  if (currentLine) {
    cx.fillStyle = 'rgba(0, 0, 0, 0.75)';
    cx.fillRect(W/2 - 500, H - 130, 1000, 100);
    
    cx.textAlign = 'center';
    cx.font = 'bold 28px "Segoe UI", sans-serif';
    
    let roleColor = "#ffffff";
    if (currentLine.role === "Рассказчик") roleColor = "#aaaaaa";
    if (currentLine.role === "Босс") roleColor = "#ff5555";
    if (currentLine.role === "Новичок") roleColor = "#55ff55";
    if (currentLine.role === "Прохожий") roleColor = "#55ffff";
    
    cx.fillStyle = roleColor;
    cx.fillText(currentLine.role, W/2, H - 95);
    
    cx.font = '26px "Segoe UI", sans-serif';
    cx.fillStyle = '#ffffff';
    cx.fillText(currentLine.text, W/2, H - 55);
  }
}

btn.onclick = async () => {
  btn.disabled = true; vid.style.display='none';
  st.textContent = '🎬 Запись...';

  const stream = cv.captureStream(FPS);
  
  try {
    const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.addTrack(micStream.getAudioTracks()[0]);
  } catch (e) {
    console.log("Микрофон не подключен, запись без голоса.");
  }

  const rec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9,opus' });
  const chunks = []; rec.ondataavailable = e => chunks.push(e.data);
  const done = new Promise(r => rec.onstop = r);
  rec.start();

  let scriptIndex = 0;
  const startRealTime = performance.now();
  speechSynthesis.cancel();

  function playNextLine() {
    if (scriptIndex >= script.length) return;
    const item = script[scriptIndex];
    
    if (item.scene) currentScene = item.scene;
    if (item.scene === "shot") flashEffect = 1.0;
    
    currentLine = item;

    const utter = new SpeechSynthesisUtterance(item.text);
    if (voices[item.role]) utter.voice = voices[item.role];
    
    utter.volume = 1.0; // МАКСИМАЛЬНАЯ ГРОМКОСТЬ
    
    // ИСПРАВЛЕННЫЕ ГОЛОСА (Без пропусков и писка)
    if (item.role === "Босс") { 
      utter.pitch = 0.7; utter.rate = 0.9; 
    } else if (item.role === "Новичок") { 
      utter.pitch = 1.0; utter.rate = 1.1; // Обычный голос
    } else if (item.role === "Прохожий") { 
      utter.pitch = 1.2; utter.rate = 1.0; 
    } else { 
      utter.pitch = 0.9; utter.rate = 0.95; 
    }

    utter.onend = () => {
      setTimeout(() => {
        currentLine = null; 
        setTimeout(playNextLine, 500);
      }, 800); 
    };

    utter.onerror = (e) => {
      console.error("Ошибка озвучки:", e);
      // Если голос сломался, идем дальше, чтобы не зависало
      currentLine = null; 
      scriptIndex++;
      setTimeout(playNextLine, 500);
    };

    speechSynthesis.speak(utter);
    scriptIndex++;
  }
  
  setTimeout(playNextLine, 500);

  function tick(now) {
    const t = (now - startRealTime) / 1000;
    if (t >= DUR) {
      st.textContent = '💾 Сохранение...';
      setTimeout(() => rec.stop(), 500);
      return;
    }
    drawScene(t);
    st.textContent = `🔴 ЗАПИСЬ: ${Math.floor(t)} / 60 сек`;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  await done;
  speechSynthesis.cancel();

  const url = URL.createObjectURL(new Blob(chunks, {type: 'video/webm'}));
  const a = document.createElement('a'); a.href=url; a.download=`heist_final.webm`; a.click();
  
  vid.src=url; vid.style.display='block'; vid.play();
  st.textContent = `✅ Готово!`; 
  btn.disabled = false;
};
</script>
</body>
</html>
