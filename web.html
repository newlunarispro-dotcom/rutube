<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Комета — Реальный мессенджер</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  
  :root {
    --orange: #f59e0b; --red: #ef4444; --bg: #050814;
    --panel: rgba(15, 23, 42, 0.85); --panel-light: rgba(30, 41, 59, 0.9);
    --text: #ffffff; --text-muted: #94a3b8;
    --msg-in: rgba(30, 41, 59, 0.95); --msg-out: linear-gradient(135deg, var(--orange), var(--red));
    --border: rgba(255,255,255,0.08); --input-bg: rgba(0,0,0,0.2);
  }
  
  [data-theme="light"] {
    --bg: #f1f5f9; --panel: rgba(255, 255, 255, 0.85); --panel-light: rgba(241, 245, 249, 0.9);
    --text: #0f172a; --text-muted: #64748b;
    --msg-in: #e2e8f0; --msg-out: linear-gradient(135deg, var(--orange), var(--red));
    --border: rgba(0,0,0,0.08); --input-bg: rgba(255,255,255,0.5);
  }

  body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; transition: 0.4s; }

  .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(var(--text), rgba(255,255,255,0) 2px); background-size: 550px 550px; opacity: 0.1; z-index: 0; pointer-events: none; animation: starsAnim 100s linear infinite; }
  @keyframes starsAnim { 100% { background-position: 550px 550px; } }
  #wave-canvas { position: fixed; bottom: 0; left: 0; width: 100%; height: 100vh; z-index: 1; pointer-events: none; opacity: 0.4; }

  /* АВТОРИЗАЦИЯ */
  .auth-screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(5, 8, 20, 0.95); z-index: 50; backdrop-filter: blur(10px); }
  .auth-box { background: var(--panel); border: 1px solid var(--border); border-radius: 24px; padding: 40px; width: 400px; text-align: center; }
  .auth-input { width: 100%; padding: 14px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text); margin-bottom: 12px; outline: none; }
  .auth-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--orange), var(--red)); border: none; border-radius: 12px; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
  .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(245, 158, 11, 0.4); }

  /* ПРИЛОЖЕНИЕ */
  .app { display: none; width: 100%; height: 100%; z-index: 10; }
  .app.active { display: flex; }

  .sidebar { width: 340px; background: var(--panel); backdrop-filter: blur(20px); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .header { padding: 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--panel-light); display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; }
  .search-area { padding: 12px; display: flex; gap: 8px; }
  .search-input { flex: 1; padding: 10px 15px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 20px; color: var(--text); outline: none; }
  .chat-list { flex: 1; overflow-y: auto; padding: 0 12px; }
  .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; cursor: pointer; transition: 0.2s; }
  .chat-item:hover { background: rgba(255,255,255,0.05); }
  .chat-item.active { background: rgba(245, 158, 11, 0.15); border-left: 3px solid var(--orange); }

  .main { flex: 1; display: flex; flex-direction: column; }
  .chat-header { padding: 16px 24px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .msg { display: flex; max-width: 70%; animation: msgIn 0.3s ease; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .msg.out { align-self: flex-end; }
  .msg-bubble { padding: 12px 18px; border-radius: 18px; background: var(--msg-in); }
  .msg.out .msg-bubble { background: var(--msg-out); color: #fff; }
  .input-area { padding: 16px 24px; background: var(--panel); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
  .input-field { flex: 1; padding: 12px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 14px; color: var(--text); outline: none; }
  .send-btn { padding: 12px 20px; background: var(--orange); border: none; border-radius: 14px; color: #fff; cursor: pointer; }

  /* Модалки */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(5px); }
  .modal.active { display: flex; }
  .modal-box { background: var(--panel); padding: 30px; border-radius: 24px; width: 400px; text-align: center; border: 1px solid var(--border); position: relative; }
  
  /* Экран Звонка */
  .call-screen { position: fixed; inset: 0; background: #000; z-index: 6000; display: none; flex-direction: column; }
  .call-screen.active { display: flex; }
  .call-video-container { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; }
  #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
  #localVideo { position: absolute; bottom: 20px; right: 20px; width: 150px; height: 100px; border-radius: 10px; object-fit: cover; border: 2px solid var(--orange); z-index: 10; }
  .call-stats { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 12px; font-family: monospace; font-size: 16px; color: #0f0; z-index: 10; }
  .call-controls { padding: 30px; display: flex; justify-content: center; gap: 20px; background: rgba(0,0,0,0.8); }
  .call-btn { width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; font-size: 24px; }
  .end-call { background: #ef4444; color: #fff; }
</style>
</head>
<body>

<div class="stars"></div>
<canvas id="wave-canvas"></canvas>

<!-- АВТОРИЗАЦИЯ -->
<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <h2 style="margin-bottom: 20px;">Комета ☄️</h2>
    <div style="margin-bottom: 20px; font-size: 14px; color: var(--text-muted);">Вход по никнейму (для теста просто введи любое имя)</div>
    <input type="text" id="loginNick" class="auth-input" placeholder="Твой Никнейм">
    <button class="auth-btn" onclick="doLogin()">Войти</button>
  </div>
</div>

<!-- ПРИЛОЖЕНИЕ -->
<div class="app" id="app">
  <aside class="sidebar">
    <div class="header">
      <div class="logo"><div class="logo-mark">☄️</div>Комета</div>
      <div class="avatar" id="myAvatar">Г</div>
    </div>
    <div class="search-area">
      <input type="text" id="searchInput" class="search-input" placeholder="Поиск..." oninput="renderSidebar()">
    </div>
    <div class="chat-list" id="chatList"></div>
  </aside>

  <main class="main">
    <div class="chat-header">
      <div class="chat-header-info">
        <div class="chat-title" id="chatTitle">Выберите чат</div>
      </div>
      <div style="display: flex; gap: 10px;" id="callButtons">
        <button class="auth-btn" style="padding: 8px 15px; width: auto; font-size: 12px;" onclick="startCall()">📹 Позвонить</button>
      </div>
    </div>
    
    <div class="messages" id="messages"></div>
    
    <div class="input-area">
      <input type="text" id="msgInput" class="input-field" placeholder="Сообщение...">
      <button class="send-btn" onclick="sendMsg()">➤</button>
    </div>
  </main>
</div>

<!-- ЗВОНОК -->
<div class="call-screen" id="callScreen">
  <div class="call-video-container">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
    <div class="call-stats" id="callStats">Ping: -- ms</div>
  </div>
  <div class="call-controls">
    <button class="call-btn end-call" onclick="endCall()">✕</button>
  </div>
</div>

<!-- Подключаем Firebase (База данных) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBHbm84N2Bjed93Xb2ccpWPsCTW138wf64",
    authDomain: "kometanm.firebaseapp.com",
    databaseURL: "https://kometanm-default-rtdb.firebaseio.com",
    projectId: "kometanm",
    storageBucket: "kometanm.firebasestorage.app",
    messagingSenderId: "389756589729",
    appId: "1:389756589729:web:bc82b216570226bbf142e0"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const $ = id => document.getElementById(id);

  let currentUser = null;
  let currentChat = null;
  let peer = null;
  let localStream = null;
  let currentCall = null;
  let pingInterval = null;

  // === АВТОРИЗАЦИЯ ===
  window.doLogin = () => {
    const nick = $('loginNick').value.trim();
    if(!nick) return alert("Введите ник!");
    currentUser = { uid: 'user_' + nick, nickname: nick };
    $('authScreen').style.display = 'none';
    $('app').classList.add('active');
    $('myAvatar').textContent = nick[0].toUpperCase();
    initChats();
    initPeer();
  };

  // === ЧАТЫ ===
  function initChats() {
    onValue(ref(db, 'chats'), (snapshot) => {
      const chats = snapshot.val() || {};
      const list = $('chatList');
      list.innerHTML = '';
      
      // Добавляем Общий чат для всех
      const generalDiv = document.createElement('div');
      generalDiv.className = 'chat-item';
      generalDiv.onclick = () => openChat('general', 'Общий чат');
      generalDiv.innerHTML = `<div class="avatar" style="background: #3b82f6;">О</div><div>Общий чат</div>`;
      list.appendChild(generalDiv);

      for (const id in chats) {
        const div = document.createElement('div');
        div.className = 'chat-item';
        div.onclick = () => openChat(id, chats[id].name);
        div.innerHTML = `<div class="avatar">${chats[id].name[0].toUpperCase()}</div><div>${chats[id].name}</div>`;
        list.appendChild(div);
      }
    });
  }

  window.openChat = (id, name) => {
    currentChat = { id, name };
    $('chatTitle').textContent = name;
    $('messages').innerHTML = '';
    
    onValue(ref(db, 'messages/' + id), (snapshot) => {
      $('messages').innerHTML = '';
      const msgs = snapshot.val() || {};
      Object.values(msgs).forEach(m => {
        const div = document.createElement('div');
        div.className = `msg ${m.uid === currentUser.uid ? 'out' : 'in'}`;
        div.innerHTML = `<div class="msg-bubble">${m.text}</div>`;
        $('messages').appendChild(div);
      });
      $('messages').scrollTop = $('messages').scrollHeight;
    });
  };

  window.sendMsg = () => {
    const text = $('msgInput').value.trim();
    if(!text || !currentChat) return;
    push(ref(db, 'messages/' + currentChat.id), { uid: currentUser.uid, text: text });
    $('msgInput').value = '';
  };

  // === РЕАЛЬНЫЙ ЗВОНОК (WEBRTC через PeerJS) ===
  function initPeer() {
    // Генерируем уникальный ID на основе ника
    const myPeerId = 'kometa_peer_' + currentUser.nickname;
    
    peer = new Peer(myPeerId);

    peer.on('open', (id) => {
      console.log('Мой Peer ID:', id);
    });

    // Прием входящего звонка
    peer.on('call', (call) => {
      if(confirm('Входящий видеозвонок! Принять?')) {
        navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
          localStream = stream;
          $('localVideo').srcObject = stream;
          call.answer(stream);
          handleCall(call);
        }).catch(err => alert("Ошибка доступа к камере: " + err));
      } else {
        call.close();
      }
    });
  }

  window.startCall = () => {
    // Для теста звоним на "kometa_peer_Собеседник"
    const targetId = prompt("Введите никнейм собеседника для звонка (например, Иван):");
    if(!targetId) return;

    navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
      localStream = stream;
      $('localVideo').srcObject = stream;
      $('callScreen').classList.add('active');
      
      const call = peer.call('kometa_peer_' + targetId, stream);
      handleCall(call);
      
      // Запускаем реальный пинг
      startRealPing();
    }).catch(err => {
      alert("Нет доступа к камере или микрофону! Разрешите доступ.");
    });
  };

  function handleCall(call) {
    currentCall = call;
    $('callScreen').classList.add('active');
    
    call.on('stream', (remoteStream) => {
      $('remoteVideo').srcObject = remoteStream;
    });
    
    call.on('close', () => {
      endCall();
    });
  }

  window.endCall = () => {
    if(currentCall) currentCall.close();
    if(localStream) localStream.getTracks().forEach(t => t.stop());
    $('callScreen').classList.remove('active');
    clearInterval(pingInterval);
  };

  // === РЕАЛЬНЫЙ ПИНГ ===
  function startRealPing() {
    clearInterval(pingInterval);
    const statsEl = $('callStats');
    
    pingInterval = setInterval(async () => {
      const start = Date.now();
      try {
        // Пингуем Cloudflare (это реальный запрос в сеть)
        await fetch('https://1.1.1.1/cdn-cgi/trace', { mode: 'no-cors' });
        const ping = Date.now() - start;
        statsEl.innerHTML = `Ping: ${ping} ms<br>Связь: ${ping < 100 ? 'Отличная' : 'Средняя'}`;
      } catch (e) {
        statsEl.innerHTML = `Ping: >500 ms<br>Связь: Плохая`;
      }
    }, 2000);
  }

  // Фон
  const canvas = document.getElementById('wave-canvas');
  const ctx = canvas.getContext('2d');
  let width, height, time = 0;
  function resize() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
  window.addEventListener('resize', resize); resize();
  function drawWave() {
    ctx.clearRect(0, 0, width, height);
    const waves = [
      { amplitude: 40, frequency: 0.003, speed: 0.02, color: 'rgba(245, 158, 11, 0.15)' },
      { amplitude: 60, frequency: 0.002, speed: -0.015, color: 'rgba(239, 68, 68, 0.15)' }
    ];
    waves.forEach((wave) => {
      ctx.beginPath(); ctx.moveTo(0, height);
      for (let x = 0; x <= width; x += 5) {
        const y = Math.sin(x * wave.frequency + time * wave.speed) * wave.amplitude;
        ctx.lineTo(x, height * 0.8 + y); 
      }
      ctx.lineTo(width, height); ctx.lineTo(0, height);
      ctx.fillStyle = wave.color; ctx.fill();
    });
    time += 1; requestAnimationFrame(drawWave);
  }
  drawWave();
</script>

<!-- Подключаем PeerJS для реального WebRTC звонка -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

</body>
</html>
