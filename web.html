<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Комета</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  :root {
    --bg: #0f172a; --panel: #1e293b; --panel-light: #334155;
    --accent: #3b82f6; --accent-hover: #2563eb;
    --text: #f8fafc; --text-muted: #94a3b8;
    --msg-in: #1e293b; --msg-out: #3b82f6;
    --border: rgba(255,255,255,0.1);
  }
  body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; }

  /* АВТОРИЗАЦИЯ */
  .auth-screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 100; }
  .auth-box { background: var(--panel); padding: 40px; border-radius: 24px; width: 380px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 1px solid var(--border); }
  .auth-tabs { display: flex; margin-bottom: 20px; }
  .auth-tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: var(--text-muted); font-weight: 600; border-bottom: 2px solid transparent; }
  .auth-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .auth-input { width: 100%; padding: 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; color: #fff; margin-bottom: 12px; outline: none; font-size: 15px; }
  .auth-input:focus { border-color: var(--accent); }
  .auth-btn { width: 100%; padding: 14px; background: var(--accent); border: none; border-radius: 12px; color: #fff; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.2s; }
  .auth-btn:hover { background: var(--accent-hover); }
  .google-btn { width: 100%; padding: 14px; background: #fff; color: #000; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }

  /* ПРИЛОЖЕНИЕ */
  .app { display: none; width: 100%; height: 100%; }
  .app.active { display: flex; }

  .sidebar { width: 320px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .header { padding: 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .logo { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .logo-mark { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden; flex-shrink: 0; cursor: pointer; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  
  .search-area { padding: 12px; display: flex; gap: 8px; }
  .search-input { flex: 1; padding: 10px 15px; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; color: #fff; outline: none; }
  .create-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); border: none; color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  
  .chat-list { flex: 1; overflow-y: auto; padding: 0 8px; }
  .chat-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; cursor: pointer; transition: 0.2s; margin-bottom: 4px; }
  .chat-item:hover { background: var(--panel-light); }
  .chat-item.active { background: var(--panel-light); }
  .chat-info { flex: 1; min-width: 0; }
  .chat-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-last { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

  .main { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; }
  .chat-header { padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .chat-header-info { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .chat-title { font-weight: 700; font-size: 16px; }
  .chat-sub { font-size: 13px; color: var(--accent); }
  .header-actions { display: flex; gap: 10px; }
  .action-btn { background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 5px; transition: 0.2s; }
  .action-btn:hover { color: var(--text); }

  .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { display: flex; gap: 10px; max-width: 70%; }
  .msg.out { align-self: flex-end; flex-direction: row-reverse; }
  .msg-bubble { padding: 10px 15px; border-radius: 16px; font-size: 15px; line-height: 1.4; position: relative; }
  .msg.in .msg-bubble { background: var(--msg-in); border-bottom-left-radius: 4px; }
  .msg.out .msg-bubble { background: var(--msg-out); color: #fff; border-bottom-right-radius: 4px; }
  .msg-author { font-size: 12px; color: var(--accent); font-weight: 600; margin-bottom: 4px; }
  .msg-time { font-size: 11px; color: rgba(255,255,255,0.6); text-align: right; margin-top: 4px; }
  audio { width: 250px; margin-top: 5px; height: 40px; }

  .input-area { padding: 16px 20px; background: var(--panel); border-top: 1px solid var(--border); }
  .input-wrapper { display: flex; align-items: flex-end; gap: 10px; background: var(--bg); padding: 8px; border-radius: 16px; border: 1px solid var(--border); }
  .input-wrapper:focus-within { border-color: var(--accent); }
  .input-field { flex: 1; background: transparent; border: none; color: #fff; resize: none; outline: none; padding: 8px; font-size: 15px; max-height: 100px; }
  .icon-btn { background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 8px; }
  .send-btn { background: var(--accent); border: none; color: #fff; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(5px); }
  .modal.active { display: flex; }
  .modal-box { background: var(--panel); padding: 30px; border-radius: 20px; width: 400px; border: 1px solid var(--border); text-align: center; }
  .modal-box h2 { margin-bottom: 20px; font-size: 22px; }
  .modal-avatar { width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 20px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 40px; background-size: cover; background-position: center; cursor: pointer; position: relative; }
  .modal-avatar:hover::after { content: '📷'; position: absolute; inset: 0; background: rgba(0,0,0,0.5); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .modal-input { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: #fff; margin-bottom: 12px; outline: none; text-align: left; }
  
  .call-screen { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; }
  .call-screen.active { display: flex; }
  .call-avatar { width: 120px; height: 120px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 50px; margin-bottom: 20px; animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(59,130,246,0.7); } 70% { box-shadow: 0 0 0 20px rgba(59,130,246,0); } 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); } }
  .call-name { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
  .call-status { color: var(--accent); font-size: 16px; margin-bottom: 40px; }
  .end-call { background: #ef4444; border: none; padding: 15px 40px; border-radius: 30px; color: #fff; font-size: 18px; font-weight: 600; cursor: pointer; }

  .recording-indicator { display: none; color: #ef4444; font-weight: bold; margin-right: 10px; align-items: center; gap: 5px; }
  .recording-indicator.active { display: flex; }
  .red-dot { width: 10px; height: 10px; background: #ef4444; border-radius: 50%; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  @media (max-width: 768px) {
    .sidebar { position: absolute; left: -100%; z-index: 100; transition: 0.3s; height: 100%; }
    .sidebar.active { left: 0; }
    .menu-btn { display: block !important; }
  }
  .menu-btn { display: none; background: transparent; border: none; color: #fff; font-size: 24px; cursor: pointer; margin-right: 10px; }
</style>
</head>
<body>

<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <h2 style="text-align:center; margin-bottom:20px;">Комета ☄️</h2>
    <div class="auth-tabs">
      <div class="auth-tab active" id="tabLogin" onclick="switchAuth('login')">Вход</div>
      <div class="auth-tab" id="tabReg" onclick="switchAuth('reg')">Регистрация</div>
    </div>
    <div id="formLogin">
      <input type="email" id="loginEmail" class="auth-input" placeholder="Email">
      <input type="password" id="loginPass" class="auth-input" placeholder="Пароль">
      <button class="auth-btn" onclick="loginEmail()">Войти</button>
    </div>
    <div id="formReg" style="display:none;">
      <input type="text" id="regName" class="auth-input" placeholder="Имя (Никнейм)">
      <input type="tel" id="regPhone" class="auth-input" placeholder="Телефон (обязательно)">
      <input type="email" id="regEmail" class="auth-input" placeholder="Email">
      <input type="password" id="regPass" class="auth-input" placeholder="Пароль">
      <button class="auth-btn" onclick="regEmail()">Создать аккаунт</button>
    </div>
    <div style="text-align:center; color:var(--text-muted); margin: 15px 0;">или</div>
    <button class="google-btn" onclick="loginGoogle()">Войти через Google</button>
  </div>
</div>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="header">
      <div class="logo"><div class="logo-mark">☄️</div>Комета</div>
      <div class="avatar" id="myAvatar" onclick="openProfile()"></div>
    </div>
    <div class="search-area">
      <input type="text" id="searchInput" class="search-input" placeholder="Поиск людей, групп...">
      <button class="create-btn" onclick="openCreate()">+</button>
    </div>
    <div class="chat-list" id="chatList"></div>
  </aside>

  <main class="main">
    <div class="chat-header">
      <div class="chat-header-info" onclick="toggleSidebar()">
        <button class="menu-btn">☰</button>
        <div>
          <div class="chat-title" id="chatTitle">Выберите чат</div>
          <div class="chat-sub" id="chatSub"></div>
        </div>
      </div>
      <div class="header-actions">
        <button class="action-btn" id="callBtn" onclick="startCall()" style="display:none;">📞</button>
        <button class="action-btn" onclick="openSettings()">⚙️</button>
      </div>
    </div>
    
    <div class="messages" id="messages"></div>
    
    <div class="input-area" id="inputArea" style="display:none;">
      <div class="recording-indicator" id="recIndicator">
        <div class="red-dot"></div> <span id="recTime">00:00</span>
      </div>
      <div class="input-wrapper">
        <button class="icon-btn" id="micBtn" onclick="toggleRecord()">🎤</button>
        <textarea class="input-field" id="msgInput" placeholder="Сообщение..." rows="1"></textarea>
        <button class="send-btn" onclick="sendMsg()">➤</button>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="profileModal">
  <div class="modal-box">
    <h2>Мой профиль</h2>
    <div class="modal-avatar" id="profAvatar" onclick="document.getElementById('avatarFile').click()"></div>
    <input type="file" id="avatarFile" accept="image/*" style="display:none;">
    <input type="text" id="profName" class="modal-input" placeholder="Имя">
    <input type="tel" id="profPhone" class="modal-input" placeholder="Телефон">
    <div style="text-align:left; margin-bottom:15px; font-size:14px; color:var(--text-muted);">Роль: <span id="profRole" style="color:var(--accent); font-weight:bold;">USER</span></div>
    <button class="auth-btn" onclick="saveProfile()">Сохранить</button>
    <button class="auth-btn" style="background:transparent; color:#ef4444; margin-top:10px;" onclick="logout()">Выйти</button>
    <button class="auth-btn" style="background:transparent; color:var(--text-muted);" onclick="closeModal('profileModal')">Отмена</button>
  </div>
</div>

<div class="modal" id="createModal">
  <div class="modal-box">
    <h2>Создать</h2>
    <input type="text" id="createName" class="modal-input" placeholder="Название">
    <select id="createType" class="modal-input">
      <option value="group">Группа (все пишут)</option>
      <option value="channel">Канал (пишет только владелец)</option>
    </select>
    <button class="auth-btn" onclick="createChat()">Создать</button>
    <button class="auth-btn" style="background:transparent; color:var(--text-muted);" onclick="closeModal('createModal')">Отмена</button>
  </div>
</div>

<div class="modal" id="settingsModal">
  <div class="modal-box">
    <h2>Настройки</h2>
    <p style="color:var(--text-muted); margin-bottom:20px;">Раздел в разработке.</p>
    <button class="auth-btn" onclick="closeModal('settingsModal')">Закрыть</button>
  </div>
</div>

<div class="call-screen" id="callScreen">
  <div class="call-avatar" id="callAvatar">А</div>
  <div class="call-name" id="callName">Собеседник</div>
  <div class="call-status" id="callStatus">Соединение...</div>
  <button class="end-call" onclick="endCall()">Завершить</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getDatabase, ref, push, onChildAdded, set, get, onValue, onDisconnect, serverTimestamp, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBHbm84N2Bjed93Xb2ccpWPsCTW138wf64",
    authDomain: "kometanm.firebaseapp.com",
    databaseURL: "https://kometanm-default-rtdb.firebaseio.com",
    projectId: "kometanm",
    storageBucket: "kometanm.firebasestorage.app",
    messagingSenderId: "389756589729",
    appId: "1:389756589729:web:bc82b216570226bbf142e0"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const provider = new GoogleAuthProvider();

  const $ = id => document.getElementById(id);
  
  let currentUser = null;
  let myProfile = { nickname: 'User', phone: '', avatar: '', role: 'user' };
  let currentChat = null;
  let allUsers = {};
  let myChats = {}; 
  let allChatsMeta = {}; 
  let mediaRecorder;
  let audioChunks = [];
  let recInterval;
  let recSeconds = 0;
  let callTimer;
  let currentMsgListener = null;

  window.switchAuth = (type) => {
    $('tabLogin').classList.toggle('active', type === 'login');
    $('tabReg').classList.toggle('active', type === 'reg');
    $('formLogin').style.display = type === 'login' ? 'block' : 'none';
    $('formReg').style.display = type === 'reg' ? 'block' : 'none';
  };

  window.loginEmail = () => signInWithEmailAndPassword(auth, $('loginEmail').value, $('loginPass').value).catch(e => alert(e.message));
  window.regEmail = () => {
    if(!$('regPhone').value) return alert("Введите телефон!");
    createUserWithEmailAndPassword(auth, $('regEmail').value, $('regPass').value).then(cred => {
      set(ref(db, 'users/'+cred.user.uid), {
        nickname: $('regName').value, phone: $('regPhone').value, avatar: '', role: 'user', online: true
      });
    }).catch(e => alert(e.message));
  };
  window.loginGoogle = () => signInWithPopup(auth, provider).catch(e => alert(e.message));
  window.logout = () => { signOut(auth); location.reload(); };

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      const userStatusRef = ref(db, '/users/' + user.uid);
      onDisconnect(userStatusRef).update({ online: false, last_changed: serverTimestamp() }).then(() => {
        userStatusRef.update({ online: true, last_changed: serverTimestamp() });
      });

      const snap = await get(ref(db, 'users/' + user.uid));
      if (snap.exists()) {
        myProfile = snap.val();
      } else {
        myProfile = { nickname: user.displayName || 'User', phone: '', avatar: user.photoURL || '', role: 'user' };
        set(ref(db, 'users/' + user.uid), myProfile);
      }
      updateProfileUI();
      $('authScreen').style.display = 'none';
      $('app').classList.add('active');
      
      onValue(ref(db, 'users'), s => { allUsers = s.val() || {}; renderSidebar(); });
      onValue(ref(db, 'chats'), s => { allChatsMeta = s.val() || {}; renderSidebar(); });
      onValue(ref(db, 'user_chats/' + user.uid), s => { myChats = s.val() || {}; renderSidebar(); });
      
    } else {
      $('authScreen').style.display = 'flex';
      $('app').classList.remove('active');
    }
  });

  function updateProfileUI() {
    const avHTML = myProfile.avatar ? `<img src="${myProfile.avatar}">` : myProfile.nickname[0].toUpperCase();
    $('myAvatar').innerHTML = avHTML;
    $('profAvatar').innerHTML = avHTML;
    $('profAvatar').style.backgroundImage = myProfile.avatar ? `url(${myProfile.avatar})` : 'none';
    $('profName').value = myProfile.nickname;
    $('profPhone').value = myProfile.phone;
    $('profRole').textContent = myProfile.role ? myProfile.role.toUpperCase() : 'USER';
  }

  window.openProfile = () => $('profileModal').classList.add('active');
  window.closeModal = (id) => $(id).classList.remove('active');

  $('avatarFile').addEventListener('change', e => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas'); c.width=120; c.height=120;
        c.getContext('2d').drawImage(img,0,0,120,120);
        myProfile.avatar = c.toDataURL('image/jpeg', 0.7);
        updateProfileUI();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  window.saveProfile = () => {
    myProfile.nickname = $('profName').value;
    myProfile.phone = $('profPhone').value;
    set(ref(db, 'users/' + currentUser.uid), myProfile);
    closeModal('profileModal');
  };

  window.openCreate = () => $('createModal').classList.add('active');
  window.createChat = async () => {
    const name = $('createName').value; const type = $('createType').value;
    if(!name) return alert("Введите название!");
    const newChatRef = push(ref(db, 'chats'));
    const chatId = newChatRef.key;
    await set(newChatRef, { name: name, type: type, owner: currentUser.uid, members: { [currentUser.uid]: true } });
    await set(ref(db, `user_chats/${currentUser.uid}/${chatId}`), true);
    closeModal('createModal');
    $('createName').value = '';
    openChat(chatId);
  };

  function renderSidebar() {
    const q = $('searchInput').value.toLowerCase().trim();
    $('chatList').innerHTML = '';
    let found = 0;

    if(q === '') {
      for (const id in myChats) {
        const meta = allChatsMeta[id];
        if(meta) {
          addChatItem(id, meta.name, meta.type, 'Группа/Канал');
          found++;
        } else {
          const otherUid = id.split('_').find(u => u !== currentUser.uid);
          if(otherUid && allUsers[otherUid]) {
            const u = allUsers[otherUid];
            addChatItem(id, u.nickname, 'private', u.online ? 'в сети' : 'был(а) недавно', u.avatar);
            found++;
          }
        }
      }
    } else {
      for (const uid in allUsers) {
        if(uid === currentUser.uid) continue;
        const u = allUsers[uid];
        if(u.nickname.toLowerCase().includes(q) || (u.phone && u.phone.includes(q))) {
          const privateId = 'private_' + [currentUser.uid, uid].sort().join('_');
          addChatItem(privateId, u.nickname, 'private', u.phone || 'Пользователь', u.avatar);
          found++;
        }
      }
      for (const id in allChatsMeta) {
        const c = allChatsMeta[id];
        if(c.name.toLowerCase().includes(q) && !myChats[id]) {
          addChatItem(id, c.name, c.type, 'Группа/Канал');
          found++;
        }
      }
    }
    if(found === 0) $('chatList').innerHTML = '<div style="padding:20px; color:var(--text-muted); text-align:center;">Ничего не найдено</div>';
  }

  function addChatItem(id, name, type, sub, avatar=null) {
    const div = document.createElement('div');
    div.className = `chat-item ${currentChat && currentChat.id === id ? 'active' : ''}`;
    div.onclick = () => openChat(id);
    let avContent = name[0].toUpperCase();
    if(avatar) avContent = `<img src="${avatar}">`;
    if(type === 'channel') avContent = '📢';
    if(type === 'group') avContent = '👥';

    div.innerHTML = `
      <div class="avatar">${avContent}</div>
      <div class="chat-info">
        <div class="chat-name">${name}</div>
        <div class="chat-last">${sub}</div>
      </div>
    `;
    $('chatList').appendChild(div);
  }

  $('searchInput').addEventListener('input', renderSidebar);

  window.openChat = (id) => {
    let name = '', type = 'private', owner = '';
    if(allChatsMeta[id]) { name = allChatsMeta[id].name; type = allChatsMeta[id].type; owner = allChatsMeta[id].owner; }
    else {
      const otherUid = id.split('_').find(u => u !== currentUser.uid);
      name = allUsers[otherUid] ? allUsers[otherUid].nickname : 'Пользователь';
    }

    currentChat = { id, name, type, owner };
    $('chatTitle').textContent = name;
    $('chatSub').textContent = type === 'channel' ? 'Канал' : type === 'group' ? 'Группа' : 'Личный чат';
    
    $('inputArea').style.display = (type === 'channel' && owner !== currentUser.uid) ? 'none' : 'block';
    $('callBtn').style.display = (type === 'private') ? 'block' : 'none';

    $('messages').innerHTML = '';
    if(currentMsgListener) off(currentMsgListener); // Отписываемся от старого чата
    currentMsgListener = ref(db, 'chats/' + id + '/messages');
    onChildAdded(currentMsgListener, snap => renderMessage(snap.val()));
    
    renderSidebar();
    if(window.innerWidth < 768) $('sidebar').classList.remove('active');
  };

  window.toggleSidebar = () => $('sidebar').classList.toggle('active');

  function renderMessage(msg) {
    const isMine = msg.uid === currentUser.uid;
    const div = document.createElement('div');
    div.className = `msg ${isMine ? 'out' : 'in'}`;
    let content = msg.type === 'voice' ? `<audio controls src="${msg.audio}"></audio>` : msg.text;
    div.innerHTML = `
      <div>
        ${!isMine && currentChat.type !== 'private' ? `<div class="msg-author">${msg.name}</div>` : ''}
        <div class="msg-bubble">${content}</div>
        <div class="msg-time">${msg.time}</div>
      </div>
    `;
    $('messages').appendChild(div);
    $('messages').scrollTop = $('messages').scrollHeight;
  }

  window.sendMsg = () => {
    const text = $('msgInput').value.trim();
    if(!text || !currentChat) return;
    if(currentChat.type === 'channel' && currentChat.owner !== currentUser.uid) return;

    const t = new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
    push(ref(db, 'chats/' + currentChat.id + '/messages'), {
      uid: currentUser.uid, name: myProfile.nickname, text: text, type: 'text', time: t
    });

    if(currentChat.id.startsWith('private_')) {
      set(ref(db, `user_chats/${currentUser.uid}/${currentChat.id}`), true);
      const otherUid = currentChat.id.split('_').find(u => u !== currentUser.uid);
      set(ref(db, `user_chats/${otherUid}/${currentChat.id}`), true);
    }
    $('msgInput').value = '';
  };

  window.toggleRecord = async () => {
    if(mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      clearInterval(recInterval);
      $('recIndicator').classList.remove('active');
      $('micBtn').style.color = 'var(--text-muted)';
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.readAsDataURL(blob);
        reader.onloadend = () => {
          const t = new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
          push(ref(db, 'chats/' + currentChat.id + '/messages'), {
            uid: currentUser.uid, name: myProfile.nickname, type: 'voice', audio: reader.result, time: t
          });
        };
        stream.getTracks().forEach(t => t.stop());
      };
      mediaRecorder.start();
      $('micBtn').style.color = '#ef4444';
      $('recIndicator').classList.add('active');
      recSeconds = 0; $('recTime').textContent = '00:00';
      recInterval = setInterval(() => {
        recSeconds++;
        $('recTime').textContent = `${Math.floor(recSeconds/60).toString().padStart(2,'0')}:${(recSeconds%60).toString().padStart(2,'0')}`;
      }, 1000);
    } catch(e) {
      alert("Нет доступа к микрофону! Разрешите в настройках браузера.");
    }
  };

  window.startCall = () => {
    if(!currentChat) return;
    $('callName').textContent = currentChat.name;
    $('callAvatar').textContent = currentChat.name[0];
    $('callScreen').classList.add('active');
    $('callStatus').textContent = 'Вызов...';
    let sec = 0;
    setTimeout(() => {
      $('callStatus').textContent = '00:00';
      callTimer = setInterval(() => {
        sec++;
        $('callStatus').textContent = `${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`;
      }, 1000);
    }, 2000);
  };

  window.endCall = () => {
    $('callScreen').classList.remove('active');
    clearInterval(callTimer);
  };

  window.openSettings = () => $('settingsModal').classList.add('active');
</script>
</body>
</html>
